  const fits=rows.filter(r=>!r.sc.miss.length).length;
  return `<div><div class="crumbs"><a href="#">1 Form</a>›<a href="#">2 Genus</a>›<span class="on">3 Species</span></div><h1 style="margin-top:6px">${esc(M.title.replace(/ Field Key$/,''))}</h1><p class="lede">${esc(M.lede)}</p></div>
  ${M.banner?`<div class="box bad">${esc(M.banner)}${cite(M.banner_src)}</div>`:''}
  ${D.compare&&D.compare.length?`<details class="panel"${M.banner?' open':''}><summary>${esc(M.compare_title||'Look-alikes side by side')}</summary>${cmpTables(gid,D.compare)}</details>`:''}
  <details class="panel"><summary>${esc(M.primer_title)}</summary>${D.primer.map(p=>`<p style="margin:0"><b>${esc(p.t)}.</b> ${esc(p.d)}${cite(p.src)}</p>`).join('')}</details>
  ${n?'':`<div class="box keyhint"><span>Answer the key questions to narrow these ${D.species.length} ${esc(M.title.replace(/ Field Key$/,'').toLowerCase())} down to one.</span> <button class="done" data-act="sheet">Start the key</button></div>`}
  <div class="keygrid">${filterPanel('What you observed', charsHTML(D.characters,sel,'s',null), n, fits, D.species.length)}
  <section class="list" aria-live="polite"><p class="resultsum">${n?`${fits} of ${D.species.length} species fit.`:`${D.species.length} species.`}</p>
  ${rows.map(({sp,sc})=>`<button type="button" class="card${n&&sc.miss.length>1?' dim':''}" data-go="s-${gid}-${sp.id}">
    ${sp.photos.length?`<img class="thumb" src="${sp.photos[0].file}" alt="" loading="lazy">`:`<span class="thumb illt">${illFor('gills')}</span>`}
    <span class="cmeta"><span class="names"><h3>${esc(sp.english)}</h3><span class="latin">${esc(sp.latin)}</span></span><p class="spot">${esc(sp.spot)}</p>
    <span class="tags">${sp.tox&&TOX[sp.tox]?`<span class="tag ${TOX[sp.tox][0]}">${TOX[sp.tox][1]}</span>`:''}${sp.conflicts&&sp.conflicts.length?'<span class="tag warn">Sources differ</span>':''}</span>${matchLine(sc,n)}</span></button>`).join('')}</section></div>`;
}
const one=(l,v)=>`<div class="fact"><h4>${l}</h4><p>${v?esc(v.t)+cite(v.s):'<span class="nr">Not recorded</span>'}</p></div>`;
const many=(l,a)=>`<div class="fact"><h4>${l}</h4>${!a||!a.length?'<p class="nr">Not recorded</p>':a.length===1?`<p>${esc(a[0].t)}${cite(a[0].s)}</p>`:`<ul>${a.map(i=>`<li>${esc(i.t)}${cite(i.s)}</li>`).join('')}</ul>`}</div>`;
const dl=(l,rows,o)=>`<div class="fact"><h4>${l}</h4><dl>${rows.map(([lab,k])=>`<dt>${esc(lab)}</dt><dd>${o&&o[k]?esc(o[k].t)+cite(o[k].s):'<span class="nr">Not recorded</span>'}</dd>`).join('')}</dl></div>`;
function speciesView(gid, sid){
  const D=ALL.guides[gid], M=D.meta, sp=D.species.find(s=>s.id===sid); if(!sp) return guideList(gid);
  const pf=M.photo_flag||(D.photos_have_base?{mode:'negative',label:'No base'}:null);
  const ptag=p=>!pf||p.base==null?'':pf.mode==='positive'?(p.base?`<span class="tag ok">${esc(pf.label)}</span>`:''):(p.base?'':`<span class="tag warn">${esc(pf.label)}</span>`);
  const used=new Set(); const add=v=>v&&v.s&&v.s.forEach(x=>used.add(x));
  ['cap','stem','smell','habitat','season','frequency','lookalikes','micro','conflicts'].forEach(f=>(sp[f]||[]).forEach(add));
  const CT=(D.compare||[]).filter(t=>(t.ids||[]).includes(sp.id)); CT.forEach(t=>t.rows.forEach(r=>r.cells.forEach(add)));
  Object.values(sp.gillspec||{}).forEach(add); Object.values(sp.genus||{}).forEach(add); [sp.spore,sp.ring,sp.volva,sp.flesh,sp.chem].forEach(add); (sp.safety_src||[]).forEach(x=>used.add(x));
  const src=code=>{const s=(code==='FN'&&sp.src_fn)||D.sources[code]||ALL.sources[code]; return s?`<span><code>${esc(code)}</code>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)}</span>`:`<span><code>${esc(code)}</code></span>`;};
  const G=(M.genus_fields||[]), OM=new Set(M.omit_fields||[]), show=(k,x)=>OM.has(k)?'':x;
  return `<div class="crumbs"><a href="#">Genus</a>›<a href="#g-${gid}">${esc(M.title.replace(/ Field Key$/,''))}</a>›<span class="on">${esc(sp.english)}</span></div>
  <div><h1>${esc(sp.english)}</h1><div class="latin" style="font-size:18px">${esc(sp.latin)} ${esc(sp.author||'')}</div>
   <div class="tags" style="margin-top:6px">${sp.tox&&TOX[sp.tox]?`<span class="tag ${TOX[sp.tox][0]}">${TOX[sp.tox][1]}</span>`:''}<span class="tag">Field ID: ${esc(sp.field_id)}</span></div></div>
  ${sp.photos.length?`<div class="gallery">${sp.photos.map(p=>`<figure><img src="${p.file}" alt="${esc(sp.english)}" loading="lazy"><figcaption><span>${lic(p.status)} ${ptag(p)} ${p.replace?'<span class="tag warn">Replace</span>':''}</span><span>${esc(p.flag||'')}</span><span>${esc(p.attribution)} · <a href="${p.url}" target="_blank" rel="noopener">iNaturalist</a></span></figcaption></figure>`).join('')}</div>`:`<div class="box">${esc(sp.no_photo||'No photograph yet.')}</div>`}
  <p class="spot" style="font-size:16px">${esc(sp.spot)}</p>${fxSpeciesBox(gid,sp)}
  ${sp.safety?`<div class="box bad"><b>Safety.</b> ${esc(sp.safety)}${cite(sp.safety_src)}</div>`:''}
  <div class="box"><b>Identification note.</b> ${esc(sp.field_note)}</div>
  ${sp.conflicts&&sp.conflicts.length?`<div class="box warn"><b>Sources differ.</b><ul>${sp.conflicts.map(c=>`<li>${esc(c.t)}${cite(c.s)}</li>`).join('')}</ul></div>`:''}
  <section class="panel"><div class="facts">${show('cap',many(M.cap_label||'Cap',sp.cap))}${show('gills',dl('Gills',[['Attachment','attachment'],['Spacing','spacing'],['Edge','edge'],['Colour','colour'],['Other','other']],sp.gillspec))}${show('stem',many('Stem',sp.stem))}${show('ring',one('Ring',sp.ring))}${show('volva',one('Volva or base',sp.volva))}${show('flesh',one('Flesh',sp.flesh))}${show('smell',many('Smell and taste',sp.smell))}${show('spore',one('Spore print',sp.spore))}${G.length?dl(M.genus_block_title||'Genus characters',G.map(([k,l])=>[l,k]),sp.genus):''}${many('Habitat and host',sp.habitat)}${many('Season',sp.season)}${many('Frequency',sp.frequency)}${many('Look-alikes',sp.lookalikes)}</div>${CT.length?`<p style="margin:4px 0 0"><button type="button" class="linkbtn" style="padding:4px 0" onclick="document.getElementById('cmp-here').scrollIntoView({behavior:'smooth'})">Look-alikes side by side below</button></p>`:''}</section>
  ${CT.length?`<section class="panel" id="cmp-here"><h2>Look-alikes side by side</h2>${cmpTables(gid,CT,sp.id)}</section>`:''}
  <details class="panel"><summary>Microscopic characters</summary>${(sp.micro||[]).map(m=>`<p style="margin:0">${esc(m.t)}${cite(m.s)}</p>`).join('')||'<p class="nr">Not recorded</p>'}</details>
  <details class="panel"><summary>Sources for this account</summary><div class="srcs">${[...used].map(src).join('')}</div></details>`;
}
function viewSketches(){
  const groups=[['How the gills meet the stem',['attach:free','Free: not touching the stem'],['attach:adnexed','Adnexed: narrowly attached'],['attach:adnate','Adnate: broadly attached'],['attach:notched','Notched: dips in before the stem'],['attach:decurrent','Decurrent: runs down the stem']],
   ['Gills or ridges',['underside:gills','Gills: thin blades'],['underside:ridges','Ridges: blunt forked folds']],
   ['Veils',['veil:ring','Ring'],['veil:cortina','Cortina: cobweb threads'],['veil:volva','Volva: cup at the base'],['veil:none','No veil']],
   ['Amanita bases',['volva:sac','Loose sac'],['volva:rim','Bulb with a rim'],['volva:rings','Rings of scales'],['volva:patches','Patches only'],['base:rooting','Rooting base']]];
  return `<h1>Field sketches</h1><p class="lede">Schematic half-sections drawn for this guide, not to scale. Cut a fruitbody in half lengthways to see the gill attachment.</p>
  ${groups.map(([t,...it])=>`<section class="panel"><h2>${t}</h2><div class="glrow">${it.map(([k,l])=>`<figure class="gl">${ICONS[k]}<figcaption>${esc(l)}</figcaption></figure>`).join('')}</div></section>`).join('')}
  <section class="panel"><h2>Spore print colours (approximate)</h2><div class="glrow">${Object.entries(SWATCH).map(([k,c])=>`<figure class="gl"><span class="sw big" style="background:${c}"></span><figcaption>${esc(ALL.characters.find(x=>x.key==='spore').opts.find(o=>o.v===k).label)}</figcaption></figure>`).join('')}</div></section>`;
}
function viewSources(){
  const list=src=>Object.entries(src).map(([k,s])=>`<span><code>${esc(k)}</code>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)}${s.note?'. '+esc(s.note):''}</span>`).join('');
  return `<h1>Sources and licences</h1><p class="lede">Every statement in the guide carries a source code. Turn on "Show citations" in the menu to see the codes beside the text.</p>
  <section class="panel"><h2>Genus key</h2><div class="srcs">${list(ALL.sources)}</div><p class="nr" style="margin:0">${esc(ALL.meta.footer)}</p></section>
  ${Object.entries(ALL.guides).map(([id,D])=>`<details class="panel"><summary>${esc(D.meta.title)} (${esc(D.meta.version)}, ${esc(D.meta.date)})</summary><div class="srcs">${list(D.sources)}</div><p class="nr" style="margin:0">${esc(D.meta.footer)}</p>
   <h3>Photograph licences</h3><div class="tablewrap"><table><thead><tr><th>Species</th><th>Licence</th><th>Credit</th><th>Observation</th></tr></thead><tbody>${D.species.flatMap(sp=>sp.photos.map(p=>`<tr><td><i>${esc(sp.latin)}</i></td><td>${lic(p.status)} ${esc(p.licence)}</td><td>${esc(p.attribution)}</td><td><a href="${p.url}" target="_blank" rel="noopener">View</a></td></tr>`)).join('')}</tbody></table></div></details>`).join('')}`;
}
function viewAbout(){ return `<h1>About and safety</h1><div class="box bad">${esc(ALL.meta.banner)}</div>
  <section class="panel"><h2>How the guide works</h2><p style="margin:0">${esc(ALL.meta.lede)}</p><p style="margin:0">Text is paraphrased from cited sources. Where sources disagree, the account says so. Photographs come from iNaturalist with the licence shown; weak examples are marked for replacement with your own.</p></section>`; }

function render(){
  const r=route(); let title='Fungi Field Key', body='', back=null;
  if(r.v==='home') body=viewHome();
  else if(r.v==='guide'){ body=guideList(r.g); title=ALL.guides[r.g].meta.title.replace(/ Field Key$/,''); back='#'; }
  else if(r.v==='species'){ body=speciesView(r.g,r.sp); title=ALL.guides[r.g].meta.title.replace(/ Field Key$/,''); back='#g-'+r.g; }
  else if(fxRoute(r)){ body = r.v==='finds'?viewFinds():r.v==='find'?viewFind(r.id):r.v==='findedit'?viewFindEdit(r):r.v==='forays'?viewForays():r.v==='foray'?viewForay(r.id):viewForayEdit(r);
    title = r.v.startsWith('foray')?'Forays':'My finds'; back = (r.v==='finds'||r.v==='forays')?'#':r.v==='find'?'#finds':r.v==='foray'?'#forays':r.v==='findedit'?(r.id==='new'?'#finds':'#find-'+r.id):(r.id==='new'?'#forays':'#foray-'+r.id); }
  else { body=r.v==='sketches'?viewSketches():r.v==='sources'?viewSources():viewAbout(); title=r.v==='sketches'?'Field sketches':r.v==='sources'?'Sources':'About'; back='#'; }
  document.getElementById('app').innerHTML = `
  <header class="bar"><div class="bar-in">${back!==null?`<a class="iconbtn" href="${back}" aria-label="Back">${SVG.back}</a>`:''}<span class="bar-title">${esc(title)}</span><button class="iconbtn" data-act="menu" aria-label="Menu">${SVG.menu}</button></div></header>
  <div class="warn-strip">Identification aid only. Never use it to decide whether a fungus is safe to eat. <a href="#about">Why</a></div>
  <main class="page">${body}</main>${fxFab(r)}
  ${ST.menu?`<div class="scrim" style="z-index:45" data-act="menu"></div><nav class="menu" aria-label="Menu"><a href="#">Genus key</a><a href="#find-new">Record a find</a><a href="#finds">My finds</a><a href="#forays">Forays</a><hr>${Object.entries(ALL.guides).map(([id,D])=>`<a href="#g-${id}">${esc(D.meta.title.replace(/ Field Key$/,''))}</a>`).join('')}<hr><a href="#sketches">Field sketches</a><a href="#sources">Sources and licences</a><a href="#about">About and safety</a><hr>
    <label class="toggle"><span>Show citations</span><input type="checkbox" id="citeT" ${ST.cite?'checked':''}></label></nav>`:''}`;
  const ct=document.getElementById('citeT'); if(ct) ct.addEventListener('change',()=>{ST.cite=ct.checked;LS.set('cite',ST.cite);render();});
}
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-form],[data-genus],[data-go],.chip'); if(!t) return;
  if(t.dataset.act==='menu'){ ST.menu=!ST.menu; return render(); }
  if(t.dataset.act==='sheet'){ ST.sheet=!ST.sheet; return render(); }
  if(t.dataset.act==='clear'){ const r=route(); if(r.v==='home'){ST.gsel={};LS.set('gsel',{});} else if(r.g){ST.sel[r.g]={};LS.set('sel',ST.sel);} return render(); }
  if(t.dataset.form){ ST.form=t.dataset.form; ST.gsel={}; ST.gopen=null; LS.set('form',ST.form); LS.set('gsel',{}); return render(); }
  if(t.dataset.genus){ ST.gopen=ST.gopen===t.dataset.genus?null:t.dataset.genus; return render(); }
  if(t.dataset.go){ return go(t.dataset.go); }
  if(t.classList.contains('chip') && (t.dataset.ctx==='g'||t.dataset.ctx==='s')){ const k=t.dataset.k,v=t.dataset.v; if(t.dataset.ctx==='g'){ if(ST.gsel[k]===v) delete ST.gsel[k]; else ST.gsel[k]=v; LS.set('gsel',ST.gsel); }
    else { const g=route().g; const s=ST.sel[g]=ST.sel[g]||{}; if(s[k]===v) delete s[k]; else s[k]=v; LS.set('sel',ST.sel); }
    const y=document.getElementById('filters')?document.getElementById('filters').scrollTop:0; render(); const f=document.getElementById('filters'); if(f) f.scrollTop=y; }
});
render();
fxInit();
</script>
