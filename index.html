<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fungi Field Key</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="fonts/fonts.css">

<style>
/* Field app shell, pipeline template v8 (11 Nov 2026, Session 8): key selections kept for the session only and cleared on moving to another species key; look-alike tables on species pages only; other English names and former scientific names shown; species keys folded in the menu with the version and an update check. Template v5 (10 Nov 2026, Session 5): look-alike tables lead with the key difference, carry a photo strip, link to the species and appear on each compared species page. v4 (10 Nov 2026): adds finds and forays, form-specific genus characters and omitted fields for non-gilled groups. Earlier: v3. Phone first: app bar, one column, filters in a bottom sheet; two columns from 900px. */
:root{
  --paper:#f5f6f2; --sheet:#ffffff; --ink:#1c1f1a; --muted:#5a6157; --rule:#dadfd5;
  --lilac:#3d5c2b; --lilac-soft:#e5eddc;
  --banner:#a53a32; --ok:#2f7a45; --ok-bg:#e3f2e7; --warn:#9a6200; --warn-bg:#fbefd8; --bad:#a53a32; --bad-bg:#f8e2df;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h:52px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141712; --sheet:#1d211b; --ink:#e9ede5; --muted:#a3ab9e; --rule:#323a2e; --lilac:#a7c98c; --lilac-soft:#22301a;
  --banner:#7a2a24; --ok:#7cc792; --ok-bg:#1d3324; --warn:#e4b35a; --warn-bg:#3a2d14; --bad:#ec8b82; --bad-bg:#3d1f1c; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#141712; --sheet:#1d211b; --ink:#e9ede5; --muted:#a3ab9e; --rule:#323a2e; --lilac:#a7c98c; --lilac-soft:#22301a;
  --banner:#7a2a24; --ok:#7cc792; --ok-bg:#1d3324; --warn:#e4b35a; --warn-bg:#3a2d14; --bad:#ec8b82; --bad-bg:#3d1f1c; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,6vw,36px)} h2{font-size:20px} h3{font-size:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;height:var(--bar-h);display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--lilac-soft)}
.iconbtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.bar-title{flex:1;min-width:0;font-family:var(--f-display);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn-strip{background:var(--banner);color:#fff;font-size:13px;line-height:1.35;padding:6px max(16px,env(safe-area-inset-left,0px));text-align:center}
.warn-strip a{color:#fff}
.page{max-width:1100px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.crumbs{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs .on{color:var(--lilac);font-weight:600}
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.forms{grid-template-columns:repeat(4,minmax(0,1fr))}}
.formbtn{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:12px;min-height:64px;cursor:pointer;font-size:14.5px;line-height:1.3}
.formbtn[aria-pressed="true"]{border-color:var(--lilac);box-shadow:inset 0 0 0 1.5px var(--lilac);background:var(--lilac-soft)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
details.panel>summary{cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;list-style-position:outside}
.keygrid{display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.keygrid{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start;gap:22px}
  .filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 12px);max-height:calc(100vh - var(--bar-h) - 40px);overflow:auto}
  .sheetbar,.sheet-head .done{display:none!important}}
@media (max-width:899px){
  .filters{position:fixed;inset:auto 0 0 0;z-index:40;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;border-bottom:0;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s ease}
  .filters.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35)}
}
@media (prefers-reduced-motion:reduce){.filters{transition:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-16px;background:var(--sheet);padding:4px 0 8px;z-index:1}
.linkbtn{border:0;background:none;color:var(--lilac);cursor:pointer;text-decoration:underline;padding:8px 4px;font-size:14px}
.done{border:0;border-radius:8px;background:var(--lilac);color:var(--sheet);font-weight:600;padding:10px 16px;cursor:pointer}
.char{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--rule)}
.char-q{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:8px 12px;min-height:40px;font-size:14px;cursor:pointer;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--lilac);color:var(--sheet);border-color:var(--lilac)}
.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.sheetbar .sum{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;min-width:0}
.resultsum{font-size:14px;color:var(--muted);margin:0}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:10px;cursor:pointer}
.card:hover{border-color:var(--lilac)}
.card.dim{opacity:.5}
.thumb{width:84px;height:84px;flex:none;border-radius:8px;object-fit:cover;background:var(--lilac-soft)}
.thumb.txt{display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:13px;text-align:center;padding:4px;line-height:1.2}
.cmeta{min-width:0;display:flex;flex-direction:column;gap:4px}
.names{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.latin{font-family:var(--f-display);font-style:italic;color:var(--muted)}
.aka{font-size:13.5px;color:var(--muted);line-height:1.35}
.menu details summary{padding:12px;border-radius:8px;cursor:pointer;font-size:16px}
.menu details[open] summary{background:var(--lilac-soft)}
.menu details a{padding-left:24px}
.menu .ver{padding:8px 12px;font-size:13px;color:var(--muted)}
.spot{margin:0;font-size:14px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--lilac-soft);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.match{font-size:12.5px;color:var(--muted)} .match b{color:var(--warn)} .match .fit{color:var(--ok)}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.gallery figure{margin:0;flex:0 0 86%;max-width:520px;scroll-snap-align:center;display:flex;flex-direction:column;gap:4px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--lilac-soft)}
.gallery figcaption{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.box{border-left:3px solid var(--lilac);background:var(--lilac-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.box.bad{border-color:var(--bad);background:var(--bad-bg)} .box.warn{border-color:var(--warn);background:var(--warn-bg)}
.box ul{margin:4px 0 0;padding-left:18px}
.facts{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:700px){.facts{grid-template-columns:1fr 1fr;column-gap:24px}}
.fact{padding:10px 0;border-top:1px solid var(--rule);min-width:0}
.fact h4{margin:0 0 3px;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--lilac);font-weight:500}
.fact p,.fact ul,.fact dl{margin:0;font-size:15px}
.fact ul{padding-left:18px}
.fact dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px} .fact dt{color:var(--muted)} .fact dd{margin:0}
.nr{color:var(--muted);font-style:italic}
sup.s{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px;min-width:520px;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600}
.cmp th.dz,.cmp td.dz{background:var(--bad-bg)}
.cmp tr.key td{background:var(--lilac-soft);font-weight:600}
.cmp tr.key td.dz{background:var(--bad-bg)}
.cmp th a{color:inherit}
.cmpph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 8px}
.cmpph figure{margin:0;display:flex;flex-direction:column;gap:3px}
.cmpph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--lilac-soft)}
.cmpph figcaption{font-size:12.5px;line-height:1.3}
.cmph{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.menu{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:50;background:var(--sheet);border-right:1px solid var(--rule);
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;overflow:auto}
.menu a,.menu button.mi{display:block;text-align:left;width:100%;padding:12px;border-radius:8px;color:var(--ink);text-decoration:none;border:0;background:none;cursor:pointer;font-size:16px}
.menu a:hover,.menu button.mi:hover{background:var(--lilac-soft)}
.menu .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;font-size:15px}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.srcs code{font-family:var(--f-mono);font-size:11.5px;color:var(--lilac);margin-right:6px}
a{color:var(--lilac)}
.chip.hasicon{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:6px 8px;min-width:76px;text-align:center}
.chip .sk{width:52px;height:39px}
.chip .sw{width:22px;height:22px}
.sk{display:block;overflow:visible}
.sk .k-cap{fill:var(--lilac-soft);stroke:var(--ink);stroke-width:1.2}
.sk .k-stem{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.sk .k-gill{fill:var(--lilac);fill-opacity:.55;stroke:var(--ink);stroke-width:1}
.sk .k-line{stroke:var(--ink);stroke-width:1;fill:none}
.sk .k-ridge{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.sk .k-ring{fill:var(--lilac);fill-opacity:.55;stroke:var(--ink);stroke-width:1.1}
.sk .k-web{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2;fill:none}
.sk .k-rim{stroke:var(--ink);stroke-width:1.4;fill:none}
.sk .k-dot{fill:var(--ink)}
.sk .k-soil{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.sw{display:inline-block;border-radius:50%;border:1px solid var(--rule)}
.sw.big{width:44px;height:44px}
.glgroup h3{font-size:16px;margin-bottom:8px}
.glrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.gl{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gl .sk{width:100px;height:75px}
.gl figcaption{font-size:12.5px;color:var(--muted)}

/* Finds and forays, v001 (10 Nov 2026) */
.fx-form{display:flex;flex-direction:column;gap:14px}
.fx-row{display:flex;flex-direction:column;gap:4px}
.fx-row label,.fx-lab{font-weight:600;font-size:14px}
.fx-row .hint{font-size:12.5px;color:var(--muted)}
.fx-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fx-in,.fx-sel,.fx-ta{font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px;width:100%;min-height:44px}
.fx-ta{min-height:84px;resize:vertical}
.fx-check{display:flex;align-items:center;gap:8px;font-size:15px;min-height:40px}
.fx-check input{width:20px;height:20px}
.fx-btns{display:flex;flex-wrap:wrap;gap:8px}
.btn2{border:1px solid var(--lilac);border-radius:8px;background:var(--sheet);color:var(--lilac);font-weight:600;padding:10px 14px;cursor:pointer;min-height:44px}
.btn2.danger{border-color:var(--bad);color:var(--bad)}
.done[disabled],.btn2[disabled]{opacity:.5;cursor:default}
.fx-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fx-photo{position:relative;margin:0}
.fx-photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--lilac-soft);display:block}
.fx-photo figcaption{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.fx-photo .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.fx-add{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--lilac);border-radius:8px;color:var(--lilac);font-weight:600;cursor:pointer;text-align:center;font-size:13.5px;padding:6px}
.fx-add input{}
.fx-status{font-size:13.5px;color:var(--muted)}
.fx-kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:15px}
.fx-kv dt{color:var(--muted)} .fx-kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fx-map{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;touch-action:manipulation}
.fx-map .g1{stroke:var(--rule);stroke-width:1}
.fx-map .g2{stroke:var(--muted);stroke-width:1;stroke-opacity:.5}
.fx-map .gl{fill:var(--muted);font:16px var(--f-mono)}
.fx-map .pt{fill:var(--lilac);stroke:var(--sheet);stroke-width:2;cursor:pointer}
.fx-map .pn{fill:var(--sheet);font:600 16px var(--f-body);pointer-events:none}
.fx-map .sb{stroke:var(--ink);stroke-width:2}
.fx-map .sbt{fill:var(--ink);font:16px var(--f-mono)}
.fx-spp{width:100%;min-width:0}
.fx-spp td:first-child{white-space:nowrap}
.fx-empty{border:1px dashed var(--rule);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.fx-conf{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px}
.fx-conf.certain{background:var(--ok-bg);color:var(--ok)} .fx-conf.probable{background:var(--lilac-soft);color:var(--lilac)}
.fx-conf.possible{background:var(--warn-bg);color:var(--warn)} .fx-conf.unknown{background:var(--rule);color:var(--muted)}
.fx-tabs{display:flex;gap:6px;flex-wrap:wrap}
.fx-tabs a{padding:8px 12px;border-radius:999px;border:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:14px}
.fx-tabs a.on{background:var(--lilac);border-color:var(--lilac);color:var(--sheet)}
.ill{--ill-fill:var(--lilac-soft);--ill-accent:var(--lilac);--ill-paper:var(--sheet);--ill-ground:var(--muted);--ill-dark:#3b3a33;
  color:var(--ink);display:block;flex:none}
.dk .ill,:root[data-theme="dark"] .ill{--ill-dark:#6a6456}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ill{--ill-dark:#6a6456}}

/* Hero */
.hero{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;border-radius:16px;
  background:linear-gradient(180deg,var(--lilac-soft),var(--sheet) 70%);border:1px solid var(--rule);overflow:hidden}
.hero .ill{width:100%;height:auto;max-height:120px;margin:-4px 0 4px;opacity:.95}
.hero h1{font-size:clamp(30px,9cqi,44px);letter-spacing:-.01em}
.hero-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sec{font-size:20px}

/* Form chooser cards with illustration */
.forms2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.page,.mpage{container-type:inline-size}
@container (min-width:640px){.forms2{grid-template-columns:repeat(4,minmax(0,1fr))}}
.formcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:14px;padding:10px 12px 12px;min-height:150px;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.formcard .ill{width:64px;height:64px;margin-bottom:4px}
.formcard .fc-t{font:600 16px/1.2 var(--f-display)}
.formcard .fc-d{font-size:12.5px;line-height:1.3;color:var(--muted)}
.formcard:hover{border-color:var(--lilac);transform:translateY(-1px);box-shadow:0 4px 14px rgb(0 0 0/.06)}
.formcard[aria-pressed="true"]{border-color:var(--lilac);box-shadow:inset 0 0 0 1.5px var(--lilac);background:var(--lilac-soft)}
@media (prefers-reduced-motion:reduce){.formcard{transition:none}.formcard:hover{transform:none}}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 18px;
  border:1.5px dashed var(--rule);border-radius:16px;background:var(--sheet)}
.empty .ill{width:160px;height:120px;margin-bottom:4px}
.empty h2{font-size:22px} .empty p{margin:0 0 6px;color:var(--muted);max-width:34ch;font-size:15px}

/* Session 4b: quick recording */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;flex:none}
.fx-snap{display:flex;flex-direction:column;gap:6px}
.snapbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;background:var(--lilac);color:var(--sheet);font-weight:600;font-size:18px;cursor:pointer}
.snapbtn .ico{width:28px;height:28px}
.snapbtn input,.fab input,.fx-add input,label.btn2 input,.fx-snap-alt input,.hero-acts label input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.snapbtn,.fab,.fx-add,label.btn2,.fx-snap-alt label,.hero-acts label{position:relative}
.snapbtn:focus-within,.fab:focus-within,.fx-add:focus-within,label.btn2:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.fx-snap-alt{display:flex;gap:14px;justify-content:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:62px;height:62px;border-radius:50%;
  background:var(--lilac);color:var(--sheet);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab .ico{width:30px;height:30px}
@media (min-width:900px){.fab{bottom:24px}}
.fx-auto{margin:0;font-size:15px} .fx-auto .src{color:var(--muted);font-size:13px}
.fx-form .chip{min-height:46px;font-size:15px}
/* v7: note between recorded fits and fits through gaps */
.gapnote{margin:6px 0 2px;font-size:13px;color:var(--muted,#666);border-top:1px dashed currentColor;padding-top:6px}
/* v6: undo toast and quick picks */
#fx-toast{position:fixed;left:16px;right:16px;bottom:116px;z-index:60;display:none;align-items:center;gap:12px;justify-content:space-between;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 10px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px;max-width:560px;margin:0 auto}
#fx-toast.show{display:flex}
#fx-toast button{background:transparent;color:var(--paper);border:1px solid currentColor;border-radius:999px;padding:8px 16px;min-height:44px;font-weight:600;font-size:15px;cursor:pointer}
.fx-quick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.fx-quick .chip{font-size:14px}
.fx-quick .lab{width:100%;font-size:13px;color:var(--muted)}
.fx-form .chip small{color:inherit;opacity:.75}
.fx-btns.sticky{position:sticky;bottom:0;z-index:5;background:var(--paper);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin:0}
.fx-btns.sticky .done,.fx-btns.sticky .btn2{flex:1;min-height:52px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
label.btn2{display:inline-flex;align-items:center;gap:6px}
.fx-add{gap:4px;display:flex;flex-direction:column}
.fx-addp{display:flex;gap:8px;margin-top:6px} .fx-addp .fx-in{flex:1}
.fx-row .hint,.fx-photo figcaption{color:var(--ink);opacity:.8}
.thumb .ill{width:100%;height:100%;padding:8px}
.thumb.illt{display:grid;place-items:center;background:var(--lilac-soft)}
.formcard{width:100%}
.hero-acts label input{display:none} .hero-acts .done,.hero-acts .btn2{display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:46px}
.keyhint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
@media (min-width:900px){.keyhint{display:none}}

hp"}, "BMS26": {"label": "BMS accepted English names for fungi (February 2026)", "url": "https://www.britmycolsoc.org.uk/english-names.html", "note": "Lee's copy, Reference/Checklists"}}, "forms": [{"id": "gills", "label": "Cap and stem with gills (or gill-like ridges)", "src": ["BFGK", "McA"]}, {"id": "pores", "label": "Cap and stem with pores or tubes underneath", "src": ["BFGK", "BFG8"]}, {"id": "bracket", "label": "Bracket on wood, no stem, pores or smooth underneath", "src": ["BFGK"], "examples": [["Birch Polypore (Fomitopsis betulina): whitish to pale buff; tiny white pores; only on birch.", ["BFGK"]], ["Blushing Bracket (Daedaleopsis confragosa): brown, zoned; buff pores that bruise pinkish; mostly birch or willow.", ["BFGK"]], ["Artist's or Southern Bracket (Ganoderma applanatum or G. australe): woody, cocoa brown; white pores bruise dark brown; separation needs advanced skills.", ["BFGK"]], ["Turkeytail (Trametes versicolor): thin, flexible, strongly zoned in many colours; cream to white pores.", ["BFGK"]], ["Hairy Curtain Crust (Stereum hirsutum): thin, zoned yellow to grey-brown, hairy above; smooth ochre underside, no pores.", ["BFGK"]]]}, {"id": "jelly", "label": "Soft and jelly-like, on wood", "src": ["BFGK"], "examples": [["Jelly Ear (Auricularia auricula-judae): ear-shaped, reddish tan; mainly on elder.", ["BFGK"]], ["Beech Jellydisc (Neobulgaria pura): pale flesh-pink spinning-top shapes; only on beech.", ["BFGK"]], ["Purple Jellydisc (Ascocoryne sarcoides): pink-red to purple, brain-like clusters then discs; beech and other wood.", ["BFGK"]]]}, {"id": "hard", "label": "Hard, crusty, dark brown to black, on wood", "src": ["BFGK"], "examples": [["Candlesnuff Fungus (Xylaria hypoxylon): thin black strands, branching and white-tipped above.", ["BFGK"]], ["Dead Man's Fingers (Xylaria polymorpha): thick black finger-like clubs, mainly on beech.", ["BFGK"]], ["Beech Woodwart (Hypoxylon fragiforme): small brown to black balls on fallen beech; Hazel Woodwart (H. fuscum) on hazel.", ["BFGK"]]]}, {"id": "puffball", "label": "Puffball or earthball: round or pear-shaped, enclosed in a skin", "src": ["BFGK"], "examples": [["Stump Puffball (Lycoperdon pyriforme): smooth, pear-shaped, in clusters on wood.", ["BFGK"]], ["Common Puffball (Lycoperdon perlatum): soft warts that rub off; white flesh when young; on soil.", ["BFGK"]], ["Common Earthball (Scleroderma citrinum): hard, coarse-scaled, thick skin; olive-black flesh; unpleasant smell.", ["BFGK"]], ["Cut every puffball in half: a young Amanita in its egg shows a small mushroom inside.", ["WFUa"]]]}, {"id": "stinkhorn", "label": "White phallic fungus with a dark, foul-smelling head", "src": ["BFGK"], "examples": [["Stinkhorn (Phallus impudicus).", ["BFGK"]]]}, {"id": "other", "label": "Something else: cup, club, coral, teeth, crust", "src": [], "examples": [["Not yet covered by this guide; see the plan for the queue.", []]]}], "characters": [{"key": "underside", "q": "What is under the cap?", "opts": [{"v": "gills", "label": "Thin, blade-like gills"}, {"v": "ridges", "label": "Blunt, forked ridges or veins running down the stem"}, {"v": "smooth", "label": "Almost smooth or finely wrinkled, running down the stem"}]}, {"key": "gillcol", "q": "Gill colour when mature (look at the oldest one)", "opts": [{"v": "white", "label": "White or cream"}, {"v": "yellow", "label": "Yellow, orange or ochre"}, {"v": "pink", "label": "Pink"}, {"v": "brown", "label": "Rust or brown"}, {"v": "dark", "label": "Grey to black"}], "forms": ["gills"]}, {"key": "capcol", "q": "Cap colour", "opts": [{"v": "bright", "label": "Bright: red, pink, purple, violet, blue, green, yellow or orange"}, {"v": "dull", "label": "Brown, grey, cream or white"}], "forms": ["gills"]}, {"key": "spore", "q": "Spore print colour", "opts": [{"v": "white", "label": "White, cream or pale yellow"}, {"v": "pink", "label": "Pink or pinkish buff"}, {"v": "brightbrown", "label": "Bright or rust brown"}, {"v": "dullbrown", "label": "Dull, clay or cocoa brown"}, {"v": "black", "label": "Black or purple-black"}, {"v": "olive", "label": "Olive brown (boletes)"}]}, {"key": "attach", "q": "How the gills meet the stem (cut it in half)", "opts": [{"v": "free", "label": "Free"}, {"v": "adnexed", "label": "Adnexed"}, {"v": "adnate", "label": "Adnate"}, {"v": "notched", "label": "Notched"}, {"v": "decurrent", "label": "Decurrent"}]}, {"key": "veil", "q": "Veil on the stem", "opts": [{"v": "ring", "label": "Ring or ring zone"}, {"v": "cortina", "label": "Cobweb veil (cortina)"}, {"v": "volva", "label": "Volva at the base"}, {"v": "none", "label": "None"}]}, {"key": "size", "q": "Cap size", "opts": [{"v": "small", "label": "Under 3 cm"}, {"v": "large", "label": "3 cm or more"}]}, {"key": "stemtex", "q": "Break the stem", "opts": [{"v": "chalk", "label": "Snaps cleanly like chalk; the cap flesh crumbles too"}, {"v": "hollow", "label": "Thin, fragile or hollow; splits or crumples"}, {"v": "fibrous", "label": "Fibrous or rubbery; bends or twists before it breaks"}], "forms": ["gills"]}, {"key": "waxy", "q": "Rub a gill between finger and thumb", "opts": [{"v": "yes", "label": "Feels waxy"}]}, {"key": "milk", "q": "Milk when the gills are cut?", "opts": [{"v": "yes", "label": "Yes, milk appears"}, {"v": "no", "label": "No milk"}]}, {"key": "substrate", "q": "Growing on", "opts": [{"v": "wood", "label": "Wood, stumps or roots"}, {"v": "soil", "label": "Soil or litter in woodland"}, {"v": "grass", "label": "Grassland or lawns"}, {"v": "dung", "label": "Dung or manured ground"}, {"v": "moss", "label": "Moss or bog"}]}, {"key": "cluster", "q": "Growth habit", "opts": [{"v": "cluster", "label": "In tight clusters from one point"}]}], "primer": [{"t": "Collect the whole fruitbody", "d": "Ease it out with the base intact; a volva, bulb or rooting base can decide the genus.", "src": ["McA", "WFUa"]}, {"t": "Take a spore print", "d": "Spore print colour is the first division in McAdam's keys; leave a cap on glass overnight and scrape the spores into a heap to judge the colour.", "src": ["McA"]}, {"t": "Look at the gill attachment", "d": "Cut the fruitbody in half lengthways to see whether the gills are free, attached or running down the stem.", "src": ["McA"]}, {"t": "Ring, cortina or volva", "d": "Note any ring, cobweb-like veil or volva; they separate large groups of genera.", "src": ["McA", "BFG8"]}, {"t": "Note substrate and trees", "d": "Wood or soil, and which trees are near: many genera are mycorrhizal with particular hosts.", "src": ["BFG8", "BFGK"]}, {"t": "Cut and smell", "d": "Milk, colour changes and smell are diagnostic in several genera.", "src": ["BFG8"]}], "genera": [{"id": "amanita", "name": "Amanita", "english": "Amanitas and grisettes", "traits": {"form": ["gills"], "spore": ["white"], "attach": ["free"], "veil": ["ring", "volva"], "size": ["large"], "milk": ["no"], "substrate": ["soil"], "cluster": [], "underside": ["gills"], "gillcol": ["white"], "capcol": ["bright", "dull"], "stemtex_not": ["chalk"]}, "facts": {"Cap": ["Very varied colours; often with white to greyish veil patches that rub off; margin lined in some. Medium to large.", ["BFG8"]], "Gills": ["Free; stay white or at most pale cream whatever the cap colour.", ["BFG8"]], "Stem": ["Large ring and/or coloured bands in some; the volva or swollen base is diagnostic.", ["BFG8"]], "Spore print": ["White.", ["BFG8"]], "Smell": ["Usually none; raw potato, sickly or honey in a few.", ["BFG8"]], "Habitat": ["Soil in mixed woodland; mycorrhizal, host tree often critical.", ["BFG8"]]}, "ukspp": ["About 30", ["BFG8"]], "safety": ["Contains the Deathcap and Destroying Angel. See the Amanita guide.", ["WFUa"]], "built": "amanita", "keys": [], "inat": 26255, "spot": "White gills, free; ring and/or volva; dig up the base.", "thumb": "Amanita/images/Amanita_phalloides_1_iNat464912503.jpeg"}, {"id": "mycena", "name": "Mycena", "english": "Bonnets", "traits": {"form": ["gills"], "spore": ["white"], "attach": ["f s Amanita"], "formerly": ["Amanita inaurata", "Amanitopsis ceciliae", "Amanita strangulata"]}, {"id": "submembranacea", "latin": "Amanita submembranacea", "author": "(Bon) Gröger", "english": "Olive Amanita", "section": "Vaginatae", "field_id": "Specialist check", "field_note": "Olive-bronze cap and a thick volva that turns grey, especially inside, are distinctive, but A. olivaceogrisea and A. reidiana need checking with spores and basidia.", "spot": "Egg-shaped olive-bronze to olive-brown cap, strongly lined; cream gills greying; stem with zig-zag floccose bands; thick volva greying inside; no ring.", "tox": "notedible", "safety": "Edibility unknown; First Nature advises treating it as suspect and not eating it.", "safety_src": ["FN-submembranacea"], "traits": {"ring": ["absent"], "volva": ["sac"], "base": ["slender", "bulb"], "veil": ["grey", "none"], "capcol": ["olive", "brown"], "margin": ["striate"], "smell": ["none"], "stempat": ["banded"], "trees": ["oakbeech", "broadleaf", "conifer", "birch"]}, "no_photo": "", "cap": [{"t": "6 to 10 cm; distinctly egg-shaped when young; olivaceous bronze to yellowish or olive-brown; margin strongly lined and often paler when young; often a grey veil patch at the centre.", "s": ["K23", "FN-submembranacea"]}], "gills": [], "stem": [{"t": "8 to 15 cm x 1 to 2 cm; pale cream to pale grey, prominently banded with zig-zag floccose scales; slightly swollen base.", "s": ["K23", "FN-submembranacea"]}], "smell": [{"t": "Not distinctive.", "s": ["FN-submembranacea"]}], "habitat": [{"t": "See Sources differ below.", "s": ["K23", "FN-submembranacea"]}], "season": [{"t": "July to October (First Nature); Kibby's illustrated collections are from October.", "s": ["FN-submembranacea", "K23"]}], "frequency": [{"t": "See Sources differ below. 33 UK iNaturalist records.", "s": ["INAT"]}], "lookalikes": [{"t": "A. olivaceogrisea: much smaller and more slender; wet shady woods, often near hazel; narrow gill trama under the microscope.", "s": ["K23"]}, {"t": "A. reidiana (formerly var. bispora): darker chestnut-brown cap, mostly 2-spored basidia; upland conifer woods; recorded in Scotland and Shropshire.", "s": ["K23", "CBIB"]}, {"t": "Snakeskin Grisette: substantial volva that collapses early; strongly lined olive-fawn cap.", "s": ["FN-submembranacea", "FN-ceciliae"]}], "micro": [{"t": "Spores subglobose to globose, about 9.5 to 13.0 x 9.0 to 12.0 µm (Kibby); roughly spherical, 10 to 14 µm (First Nature). Volval tissue filamentous outside, with large sphaerocysts inside.", "s": ["K23", "FN-submembranacea"]}], "conflicts": [{"t": "Habitat: Kibby (2023) says mixed deciduous woods, particularly with oak and beech; First Nature says mainly coniferous forest with fir, larch and spruce, occasionally birch. Contu (2003) gives conifers. Funga Nordica (2008) gives conifers and deciduous trees, especially spruce, which accommodates both views.", "s": ["K23", "FN-submembranacea", "C03", "FN08"]}, {"t": "Frequency: Kibby says less common but locally frequent in parts of southern England; First Nature says very uncommon to rare.", "s": ["K23", "FN-submembranacea"]}, {"t": "Volva: Kibby describes it as rather thick; First Nature as thin and leathery.", "s": ["K23", "FN-submembranacea"]}], "spore": {"t": "White", "s": ["FN-submembranacea"]}, "ring": {"t": "None.", "s": ["K23", "FN-submembranacea"]}, "volva": {"t": "Thick with flared upper edges; white or cream at first, soon flushed grey, especially on the inner surface (Kibby). First Nature describes it as thin and leathery, greying and hardening like flaking grey paint.", "s": ["K23", "FN-submembranacea"]}, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Free", "s": ["FN-submembranacea"]}, "spacing": {"t": "Moderately crowded; many short gills", "s": ["FN-submembranacea"]}, "edge": null, "colour": {"t": "Cream, becoming grey or brownish with age", "s": ["K23", "FN-submembranacea"]}, "other": null}, "genus": {"veil": {"t": "Often a grey central patch", "s":   Object.entries(ALL.guides).forEach(([gid,D])=>D.species.forEach(sp=>out.push({key:`s:${gid}:${sp.id}`, rank:'species', guide:gid, sid:sp.id, latin:sp.latin, english:sp.english, label:`${sp.english} (${sp.latin})`})));

const taxonName = f => f.taxon ? f.taxon.english : (f.taxonText || 'Unidentified');
const taxonLatin = f => f.taxon ? f.taxon.latin : '';

async function fxInit(){
  try{
    if(!window.claude || !claude.use){ FX.loading=false; FX.err='unavailable'; return; }
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user){ FX.loading=false; FX.err='unavailable'; return rr(); }
    FX.uid = await user.id();
    if(!FX.uid){ FX.loading=false; FX.err='signedout'; return rr(); }
    FX.db=db; FX.col=db.collection('data/users/'+FX.uid);
    claude.use('assets').then(a=>{ FX.assets=a; rr(); }).catch(()=>{}); lib('exifr').catch(()=>{});
    claude.use('downloads').then(d=>{ FX.dl=d; });
    const timer=setTimeout(()=>{ if(FX.loading){ FX.loading=false; FX.err='slow'; rr(); } }, 10000);
    FX.col.onSnapshot(snap=>{ clearTimeout(timer); const first=FX.loading; FX.loading=false; if(!first && snap.docChanges && !snap.docChanges().length) return; if(!snap.metadata.fromCache && FX.err==='slow') FX.err='';
      const all=snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
      FX.finds=all.filter(x=>x.kind==='find').sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''))||(b.created||'').localeCompare(a.created||''));
      FX.forays=all.filter(x=>x.kind==='foray').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      rr(); }, e=>{ clearTimeout(timer); FX.loading=false; FX.err=e.code||'unavailable'; rr(); });
    db.collection('people').onSnapshot(s=>{ FX.people=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).filter(p=>p&&p.name&&!p.hidden).sort((a,b)=>(b.forays||0)-(a.forays||0)||(b.ids||0)-(a.ids||0)||a.name.localeCompare(b.name)); const r=route(); if(fxRoute(r)||r.v==='home') render(); }, ()=>{});
  }catch(e){ FX.loading=false; FX.err='unavailable'; rr(); }
}
function rr(){ const r=route(); if((r.v==='findedit'||r.v==='forayedit') && document.querySelector('.fx-form')) return; if(fxRoute(r)||r.v==='species'||r.v==='home') render(); }
function fxGate(){
  if(FX.db && !FX.loading && !FX.err) return '';
  if(FX.db && FX.err==='slow') return '<div class="box warn">Your records cannot be reached yet; what is shown may be out of date. New finds are kept on this phone until they send.</div>';
  if(FX.loading) return '<p class="fx-status">Opening your records…</p>';
  const why = FX.err==='signedout' ? 'Records cannot be opened on this phone.' : FX.err==='slow' ? 'Your records cannot be reached yet. Check the connection; they will appear when it returns.' :
    'This browser cannot store records. Open the app in Chrome, not in a private tab.';
  return `<div class="box warn">${esc(why)}</div>`;
}
const fxFind = id => FX.finds.find(f=>f.id===id);
const fxForay = id => FX.forays.find(f=>f.id===id);
function fxPos(f){ if(f.lat==null||f.lon==null) return null; const p=GEO.toEN(f.lat,f.lon); return p; }
function fxGridRef(f){ if(f.gridref) return f.gridref; const p=fxPos(f); return p?GEO.gridRef(p.E,p.N,8):''; }
const confTag = c => c ? `<span class="fx-conf ${esc(c)}">${esc((CONF.find(x=>x[0]===c)||[c,c])[1])}</span>` : '';

/* v6: undo toast (8 seconds). Kept outside the rendered page so a re-render does not remove it. */

function toast(msg, undo){ let el=document.getElementById('fx-toast'); if(!el){ el=document.createElement('div'); el.id='fx-toast'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button">Undo</button>':''}`; el.className='show';
  if(undo) el.querySelector('button').onclick=()=>{ el.className=''; clearTimeout(TOAST.t); undo(); };
  clearTimeout(TOAST.t); TOAST.t=setTimeout(()=>{ el.className=''; }, 8000); }
const stripId = o => { const b=JSON.parse(JSON.stringify(o)); delete b.id; return b; };
/* v6: quick picks, the names already recorded on this foray (or in the last three days), newest first. */
function quickTaxa(d){ const seen=new Set(), out=[], cut=isoDate(new Date(Date.now()-3*864e5));
  const pool=FX.finds.filter(f=>f.id!==d.id && (d.foray ? f.foray===d.foray : (f.date||'')>=cut) && (f.taxon||f.taxonText));
  for(const f of pool){ const k=taxonKey(f); if(seen.has(k)) continue; seen.add(k); out.push({k, name:taxonName(f), f}); if(out.length>=8) break; }
  return out; }
function quickChips(d){ const q=quickTaxa(d); if(!q.length) return '';
  const cur=d.taxon?d.taxon.key:d.taxonText?('t:'+d.taxonText.trim().toLowerCase()):'';
  return `<div class="fx-quick"><span class="lab">${d.foray?'Already found on this foray':'Recently recorded'}</span>${q.map(x=>`<button type="button" class="chip" data-act="fx-quick" data-k="${esc(x.k)}" aria-pressed="${x.k===cur}">${esc(x.name)}</button>`).join('')}</div>`; }
function formChars(fid){ return ALL.characters.filter(c=>(c.forms?c.forms.includes(fid):['gills','pores'].includes(fid)) && !(fid==='pores'&&['attach','milk','underside','waxy'].includes(c.key))); }
function setTaxon(v){ const d=FX.draft; const t=TAXA.find(x=>x.label===v) || TAXA.find(x=>x.latin.toLowerCase()===v.trim().toLowerCase()) || TAXA.find(x=>x.english.toLowerCase()===v.trim().toLowerCase());
  if(t){ d.taxon={key:t.key, rank:t.rank, guide:t.guide||null, sid:t.sid||null, gen:t.gen||null, latin:t.latin, english:t.english, label:t.label}; d.taxonText=''; }
  else { d.taxon=null; d.taxonText=v.trim(); } }
function fixConf(){ const d=FX.draft; const has=!!(d.taxon||d.taxonText); if(has && d.confidence==='unknown') d.confidence='probable'; if(!has) d.confidence='unknown'; }
function setGrid(v){ const d=FX.draft; v=v.trim(); if(!v){ d.gridref=''; return; } const p=GEO.parseRef(v);
  if(!p){ FX.msg='That grid reference was not recognised. Use two letters and an even number of digits, for example SJ 4915 1249.'; return; }
  const ll=GEO.toLL(p.E,p.N); d.lat=ll.lat; d.lon=ll.lon; d.acc=p.size/2; d.gridref=GEO.gridRef(p.E-p.size/2+0.01,p.N-p.size/2+0.01,Math.min(10,2*(5-Math.round(Math.log10(p.size))))); FX.msg=''; }
async function addPhotos(files){ const d=FX.draft; if(!d) return; FX.pending=(FX.pending||0)+1; render();
  const ph=await processPhotos(files); d.photos.push(...ph); applyAuto(d); FX.pending--; if(FX.draft===d){ saveDraft(); if(d.id){ try{ await persistDraft(); }catch(e){} } } render(); }
async function saveFind(){
  const d=FX.draft; if(!FX.col) return; const now=new Date().toISOString();
  const body=Object.assign({}, d); delete body.id; body.kind='find'; body.updated=now; if(!body.created) body.created=now;
  if(!body.date){ const n=new Date(); body.date=isoDate(n); if(!body.time) body.time=isoTime(n); }
  if(!body.gridref && body.lat!=null){ const p=GEO.toEN(body.lat,body.lon); body.gridref=GEO.gridRef(p.E,p.N,8); }
  if(d.recorder) LS.set('recorder', d.recorder);
  FX.busy='Saving…'; render();
  try{ const ref = d.id ? FX.col.doc(d.id) : FX.col.doc(); await ref.set(body); FX.draft=null; LS.set('fxdraft',null); FX.busy=''; FX.msg=''; go('find-'+ref.id); }
  catch(e){ FX.busy=''; FX.msg = e&&e.code==='quota_exceeded' ? 'Storage is full; the find was not saved.' : 'The find could not be saved; try again.'; render(); }
}

/* ---------- v2 (Session 4b): quick recording, people and attendees ---------- */
const CAM = '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>';
const SUBSTRATES = ['Soil','Leaf litter','Dead wood','Living tree','Grass','Moss','Dung','Cones or needles'];
const todayForay = () => FX.forays.find(y=>y.date===isoDate(new Date()));
const activeForay = () => { const y=fxForay(FX.activeForay); return (y && y.date===isoDate(new Date())) ? y : (todayForay()||null); };
const groupAbbrev = g => (String(g||'').match(/\b[A-Z]/g)||[]).join('') || '';
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || ('p-'+Date.now());
function attendeesOf(y){ if(!y) return []; if(Array.isArray(y.attendees)) return y.attendees; return String(y.participants||'').split(',').map(s=>s.trim()).filter(Boolean); }
function geoNow(ms){ ms=ms||8000; return new Promise(res=>{ if(!navigator.geolocation) return res(null); let done=false; const t=setTimeout(()=>{ done=true; res(null); }, ms+500);
  try{ navigator.geolocation.getCurrentPosition(p=>{ if(done) return; done=true; clearTimeout(t); res({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}); },
    ()=>{ if(done) return; done=true; clearTimeout(t); res(null); }, {enableHighAccuracy:true, timeout:ms, maximumAge:60000}); }catch(e){ done=true; clearTimeout(t); res(null); } }); }
async function processPhotos(files){
  const out=[]; if(!FX.assets){ FX.msg='Photo storage is not available in this view.'; return out; }
  let ex=null; try{ ex=await Promise.race([lib('exifr'), new Promise(r=>setTimeout(()=>r(null),6000))]); }catch(e){ ex=null; }
  let n=0; for(const file of files){ n++; FX.busy=`Saving photo ${n} of ${files.length}…`; paintBusy();
    let meta={}; if(ex){ try{ meta=await ex.parse(file,{tiff:true,exif:true,gps:true,xmp:false,icc:false,iptc:false,jfif:false,ihdr:false})||{}; }catch(e){ meta={}; } }
    const dt=meta.DateTimeOriginal||meta.CreateDate||null; const taken=dt instanceof Date&&!isNaN(dt)?`${isoDate(dt)}T${isoTime(dt)}`:'';
    const lat=typeof meta.latitude==='number'&&isFinite(meta.latitude)?meta.latitude:null, lon=typeof meta.longitude==='number'&&isFinite(meta.longitude)?meta.longitude:null;
    let blob=file, w=null, h=null;
    let ok=false; try{ const bmp=await createImageBitmap(file,{imageOrientation:'from-image', resizeWidth:2048, resizeQuality:'high'}); const s=Math.min(1,2730/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas');
      c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); w=c.width; h=c.height; if(bmp.close) bmp.close();
      blob=await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.86)); c.width=c.height=0; ok=blob!==file; }catch(e){ blob=file; }
    if(!ok && (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size>20*1024*1024)){ FX.msg=`${file.name} could not be converted on this phone; use JPEG photos.`; continue; }
    try{ const up=await FX.assets.upload(blob,{type:blob.type||'image/jpeg'});
      out.push({asset:up.id, name:file.name, w, h, taken, lat, lon, alt:typeof meta.GPSAltitude==='number'?Math.round(meta.GPSAltitude):null, acc:typeof meta.GPSHPositioningError==='number'?meta.GPSHPositioningError:null});
    }catch(e){ FX.msg = e&&e.code==='too_large' ? `${file.name} is too large to store (20 MB limit).` : e&&e.code==='quota_or_state' ? 'The app\'s photo storage is full.' :
      e&&e.code==='unsupported_type' ? `${file.name} is in a format this browser cannot convert; export it as JPEG first.` : `${file.name} could not be stored.`; }
  }
  FX.busy=''; return out;
}
function paintBusy(){ const el=document.getElementById('fx-busy'); if(el) el.textContent=FX.busy; }
function applyAuto(d){
  const pt=d.photos.find(p=>p.taken); if(pt && (!d.date || d.whenSrc!=='manual')){ d.date=pt.taken.slice(0,10); d.time=pt.taken.slice(11,16); d.whenSrc='photo'; }
  const pp=d.photos.find(p=>p.lat!=null); if(pp && (d.lat==null || d.posSrc!=='manual')){ d.lat=pp.lat; d.lon=pp.lon; d.acc=pp.acc; d.posSrc='photo'; d.gridref=''; }
}
async function autoPosition(d){ if(d.lat!=null) return; const g=await geoNow(8000);
  if(g && FX.draft===d && d.lat==null){ d.lat=g.lat; d.lon=g.lon; d.acc=g.acc; d.posSrc='phone'; d.gridref=''; return; }
  if(d.lat==null){ const y=d.foray&&fxForay(d.foray); const ref=y&&lastPosOn(y.id); if(ref){ Object.assign(d,{lat:ref.lat, lon:ref.lon, acc:Math.max(ref.acc||0,250), posSrc:'foray'}); } } }
function lastPosOn(fid){ const f=FX.finds.filter(x=>x.foray===fid && x.lat!=null).sort((a,b)=>(b.created||'').localeCompare(a.created||''))[0]; return f?{lat:f.lat,lon:f.lon,acc:f.acc}:null; }
function syncFields(){ const d=FX.draft; if(!d) return; const tx=document.getElementById('fx-taxon'); if(tx){ setTaxon(tx.value); fixConf(); delete d.taxonRaw; }
  const gr=document.getElementById('fx-gr'); if(gr && gr.value.trim()){ setGrid(gr.value); d.posSrc='manual'; } delete d.gridRaw; }
async function persistDraft(){ const d=FX.draft; if(!d||!FX.col) return null; const now=new Date().toISOString();
  if(!d.date){ const n=new Date(); d.date=isoDate(n); d.time=isoTime(n); d.whenSrc='clock'; }
  const body=Object.assign({}, d); delete body.id; body.kind='find'; body.updated=now; if(!body.created) body.created=now;
  if(!body.gridref && body.lat!=null){ const p=GEO.toEN(body.lat,body.lon); body.gridref=GEO.gridRef(p.E,p.N,8); }
  const ref = d.id ? FX.col.doc(d.id) : FX.col.doc(); d.id=ref.id; d.created=body.created; saveDraft();
  if(FX.draft===d && location.hash!=='#find-edit-'+ref.id) history.replaceState(null,'','#find-edit-'+ref.id);
  await ref.set(body); return ref.id; }
function saveFind(){ const d=FX.draft; if(!d||!FX.col||FX.pending) return; syncFields();
  const prev = FX.editPrev && FX.editPrev.id===d.id ? FX.editPrev : null; FX.editPrev=null;
  const p=persistDraft(); const id=d.id;
  p.catch(()=>{ FX.msg='Not yet sent: it will be saved when you have signal. Keep the app open.'; render(); });
  FX.draft=null; LS.set('fxdraft',null); FX.geoTried=false; FX.msg=''; try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){} go('find-'+id);
  toast(prev?'Changes saved.':'Find saved.', ()=>{ const ref=FX.col.doc(id);
    (prev ? p.then(()=>ref.set(stripId(prev))).then(()=>{ toast('Changes undone.'); }) : p.then(()=>ref.delete()).then(()=>{ toast('Find removed.'); go('finds'); }))
      .catch(()=>{ FX.msg='That could not be undone.'; render(); }); }); }
async function quickSnap(files, forayId){ if(FX.pending) return;
  if(!FX.col){ FX.msg='Your records cannot be reached yet.'; return render(); }
  if(FX.draft && FX.draft.id){ try{ await persistDraft(); }catch(e){} }
  const y = forayId ? fxForay(forayId) : activeForay(); const d=newFind(null); if(y){ d.foray=y.id; d.site=y.site||y.name||''; }
  FX.draft=d; saveDraft(); FX.pending=(FX.pending||0)+1; FX.busy='Saving photo…'; if(location.hash==='#find-new') render(); else go('find-new');
  const geoP = geoNow(8000);
  d.photos.push(...await processPhotos(files)); applyAuto(d);
  if(d.lat==null){ const g=await geoP; if(g){ Object.assign(d,{lat:g.lat, lon:g.lon, acc:g.acc, posSrc:'phone'}); } else await autoPosition(d); }
  FX.pending--; try{ await persistDraft(); }catch(e){ FX.msg='Kept on this phone for now; it will send when you have signal.'; }
  FX.busy=''; if(FX.draft===d) render(); }
function newFind(pre){ const y=activeForay();

    taxon:pre||null, taxonText:'', confidence:pre?'probable':'unknown', form:ST.form||'gills', chars:{}, habitat:'', substrate:'', host:'', abundance:'', specimen:false, sporeprint:'', notes:'',
    finder:FX.me||'', identifier:'', recorder:FX.me||''}; }
function peopleFor(d){ const y=d.foray&&fxForay(d.foray); let names=attendeesOf(y); if(!names.length) names=FX.people.slice(0,12).map(p=>p.name);
  names=names.slice(); if(FX.me && !names.includes(FX.me)) names.unshift(FX.me); return names; }
function personChips(field, d, extra){ const names=peopleFor(d).concat(extra||[]); if(d[field] && !names.includes(d[field])) names.push(d[field]);
  return `<div class="chips">${names.map(n=>`<button type="button" class="chip" data-act="fx-person" data-f="${field}" data-v="${esc(n)}" aria-pressed="${d[field]===n}">${esc(n)}${n===FX.me?' <small>(me)</small>':''}</button>`).join('')}</div>`; }
const SRC = {photo:'from photo', phone:'from phone', foray:'approximate: last position on this foray', clock:'time saved', manual:'entered'};
function snapBar(fy, big){ const f=esc(fy||'');
  return `${LOCAL.statusHTML(FX.finds)}<div class="fx-snap${big?' big':''}"><label class="snapbtn">${CAM}<span>Snap a find</span><input type="file" accept="image/*" capture="environment" data-act="fx-snap" data-foray="${f}"></label>
   <div class="fx-snap-alt"><label class="linkbtn">Choose photos<input type="file" accept="image/*" multiple data-act="fx-snap" data-foray="${f}"></label><a class="linkbtn" href="#find-new" data-act="fx-nophoto" data-foray="${f}">No photo</a></div></div>`; }

/* ---------- forays with attendees ---------- */
function newForay(){ const g=LS.get('fxgroup','Shropshire Fungus Group'); return {kind:'foray', id:null, name:'', date:isoDate(new Date()), site:'', group:g, attendees:FX.me?[FX.me]:[], weather:'', notes:''}; }
function viewForayEdit(r){
  const g=fxGate(); if(!FX.db) return g;
  if(r.id==='new'){ if(!FX.ydraft||FX.ydraft.id) FX.ydraft=newForay(); } else if(!FX.ydraft||FX.ydraft.id!==r.id){ const y=fxForay(r.id); if(!y) return '<h1>Foray not found</h1>'; FX.ydraft=JSON.parse(JSON.stringify(y)); FX.ydraft.attendees=attendeesOf(y); }

  const all=FX.people.map(p=>p.name); d.attendees.forEach(n=>{ if(!all.includes(n)) all.push(n); });
  return `<div class="crumbs"><a href="#forays">Forays</a>›<span class="on">${d.id?'Edit foray':'New foray'}</span></div><h1>${d.id?'Edit foray':'New foray'}</h1><div class="fx-form">
  ${f('name','Site or foray name','Oaks Wood')}
  ${!FX.me&&FX.people.length?`<div class="fx-row"><label for="fy-me">Which one is you?</label><select id="fy-me" class="fx-sel" data-act="fx-setme"><option value="">Choose</option>${FX.people.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div>`:''}

function speciesList(fs){ const m=new Map(); const rank={certain:0,probable:1,possible:2,unknown:3};

  for(let n=Math.ceil(y0/step)*step; n<=y1; n+=step){ const km=n%1000===0; g+=`<line class="${km?'g2':'g1'}" x1="0" y1="${sy(n)}" x2="${W}" y2="${sy(n)}"/>`; if(km) g+=`<text class="gl" x="4" y="${sy(n)-4}">${String(Math.floor(n/1000)%100).padStart(2,'0')}</text>`; }

}

   ['Gills or ridges',['underside:gills','Gills: thin blades'],['underside:ridges','Ridges: blunt forked folds']],
   ['Veils',['veil:ring','Ring'],['veil:cortina','Cortina: cobweb threads'],['veil:volva','Volva: cup at the base'],['veil:none','No veil']],
   ['Amanita bases',['volva:sac','Loose sac'],['volva:rim','Bulb with a rim'],['volva:rings','Rings of scales'],['volva:patches','Patches only'],['base:rooting','Rooting base']]];
  return `<h1>Field sketches</h1><p class="lede">Schematic half-sections drawn for this guide, not to scale. Cut a fruitbody in half lengthways to see the gill attachment.</p>
  ${groups.map(([t,...it])=>`<section class="panel"><h2>${t}</h2><div class="glrow">${it.map(([k,l])=>`<figure class="gl">${ICONS[k]}<figcaption>${esc(l)}</figcaption></figure>`).join('')}</div></section>`).join('')}
  <section class="panel"><h2>Spore print colours (approximate)</h2><div class="glrow">${Object.entries(SWATCH).map(([k,c])=>`<figure class="gl"><span class="sw big" style="background:${c}"></span><figcaption>${esc(ALL.characters.find(x=>x.key==='spore').opts.find(o=>o.v===k).label)}</figcaption></figure>`).join('')}</div></section>`;
}
function viewSources(){
  const list=src=>Object.entries(src).map(([k,s])=>`<span><code>${esc(k)}</code>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)}${s.note?'. '+esc(s.note):''}</span>`).join('');
  return `<h1>Sources and licences</h1><p class="lede">Every statement in the guide carries a source code. Turn on "Show citations" in the menu to see the codes beside the text.</p>
  <section class="panel"><h2>Genus key</h2><div class="srcs">${list(ALL.sources)}</div><p class="nr" style="margin:0">${esc(ALL.meta.footer)}</p></section>
  ${Object.entries(ALL.guides).map(([id,D])=>`<details class="panel"><summary>${esc(D.meta.title)} (${esc(D.meta.version)}, ${esc(D.meta.date)})</summary><div class="srcs">${list(D.sources)}</div><p class="nr" style="margin:0">${esc(D.meta.footer)}</p>
   <h3>Photograph licences</h3><div class="tablewrap"><table><thead><tr><th>Species</th><th>Licence</th><th>Credit</th><th>Observation</th></tr></thead><tbody>${D.species.flatMap(sp=>sp.photos.map(p=>`<tr><td><i>${esc(sp.latin)}</i></td><td>${lic(p.status)} ${esc(p.licence)}</td><td>${esc(p.attribution)}</td><td><a href="${p.url}" target="_blank" rel="noopener">View</a></td></tr>`)).join('')}</tbody></table></div></details>`).join('')}`;
}
function viewAbout(){ return `<h1>About and safety</h1><div class="box bad">${esc(ALL.meta.banner)}</div>
  <section class="panel"><h2>How the guide works</h2><p style="margin:0">${esc(ALL.meta.lede)}</p><p style="margin:0">Text is paraphrased from cited sources. Where sources disagree, the account says so. Photographs come from iNaturalist with the licence shown; weak examples are marked for replacement with your own.</p></section>`; }

function render(){
  const r=route(); let title='Fungi Field Key', body='', back=null;
  if(r.g && r.g!==ST.curG){ ST.sel={}; ST.curG=r.g; SS.set('sel',ST.sel); SS.set('curG',ST.curG); }
  if(r.v==='home') body=viewHome();
  else if(r.v==='guide'){ body=guideList(r.g); title=ALL.guides[r.g].meta.title.replace(/ Field Key$/,''); back='#'; }
  else if(r.v==='species'){ body=speciesView(r.g,r.sp); title=ALL.guides[r.g].meta.title.replace(/ Field Key$/,''); back='#g-'+r.g; }
  else if(fxRoute(r)){ body = r.v==='finds'?viewFinds():r.v==='find'?viewFind(r.id):r.v==='findedit'?viewFindEdit(r):r.v==='forays'?viewForays():r.v==='foray'?viewForay(r.id):viewForayEdit(r);
    title = r.v.startsWith('foray')?'Forays':'My finds'; back = (r.v==='finds'||r.v==='forays')?'#':r.v==='find'?'#finds':r.v==='foray'?'#forays':r.v==='findedit'?(r.id==='new'?'#finds':'#find-'+r.id):(r.id==='new'?'#forays':'#foray-'+r.id); }
  else { body=r.v==='sketches'?viewSketches():r.v==='sources'?viewSources():viewAbout(); title=r.v==='sketches'?'Field sketches':r.v==='sources'?'Sources':'About'; back='#'; }
  document.getElementById('app').innerHTML = `
  <header class="bar"><div class="bar-in">${back!==null?`<a class="iconbtn" href="${back}" aria-label="Back">${SVG.back}</a>`:''}<span class="bar-title">${esc(title)}</span><button class="iconbtn" data-act="menu" aria-label="Menu">${SVG.menu}</button></div></header>
  <div class="warn-strip">Identification aid only. Never use it to decide whether a fungus is safe to eat. <a href="#about">Why</a></div>
  <main class="page">${body}</main>${fxFab(r)}
  ${ST.menu?`<div class="scrim" style="z-index:45" data-act="menu"></div><nav class="menu" aria-label="Menu"><a href="#">Genus key</a><a href="#find-new">Record a find</a><a href="#finds">My finds</a><a href="#forays">Forays</a><details${ST.keys?' open':''} id="menuKeys"><summary>Species keys (${Object.keys(ALL.guides).length})</summary>${Object.entries(ALL.guides).sort((a,b)=>a[1].meta.title.localeCompare(b[1].meta.title)).map(([id,D])=>`<a href="#g-${id}">${esc(D.meta.title.replace(/ Field Key$/,''))}</a>`).join('')}</details><hr><a href="#sketches">Field sketches</a><a href="#sources">Sources and licences</a><a href="#about">About and safety</a><hr>
    <label class="toggle"><span>Show citations</span><input type="checkbox" id="citeT" ${ST.cite?'checked':''}></label><hr><div class="ver">Version ${esc(ALL.meta.version)}, ${esc(ALL.meta.date)}</div>${typeof LOCAL!=='undefined'&&LOCAL.updateHTML?LOCAL.updateHTML():''}</nav>`:''}`;
  const ct=document.getElementById('citeT'); if(ct) ct.addEventListener('change',()=>{ST.cite=ct.checked;LS.set('cite',ST.cite);render();});
  const mk=document.getElementById('menuKeys'); if(mk) mk.addEventListener('toggle',()=>{ST.keys=mk.open;});
}
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-form],[data-genus],[data-go],.chip'); if(!t) return;
  if(t.dataset.act==='menu'){ ST.menu=!ST.menu; return render(); }
  if(t.dataset.act==='sheet'){ ST.sheet=!ST.sheet; return render(); }
  if(t.dataset.act==='clear'){ const r=route(); if(r.v==='home'){ST.gsel={};SS.set('gsel',{});} else if(r.g){ST.sel[r.g]={};SS.set('sel',ST.sel);} return render(); }
  if(t.dataset.form){ ST.form=t.dataset.form; ST.gsel={}; ST.gopen=null; SS.set('form',ST.form); SS.set('gsel',{}); return render(); }
  if(t.dataset.genus){ ST.gopen=ST.gopen===t.dataset.genus?null:t.dataset.genus; return render(); }
  if(t.dataset.go){ return go(t.dataset.go); }
  if(t.classList.contains('chip') && (t.dataset.ctx==='g'||t.dataset.ctx==='s')){ const k=t.dataset.k,v=t.dataset.v; if(t.dataset.ctx==='g'){ if(ST.gsel[k]===v) delete ST.gsel[k]; else ST.gsel[k]=v; SS.set('gsel',ST.gsel); }
    else { const g=route().g; const s=ST.sel[g]=ST.sel[g]||{}; if(s[k]===v) delete s[k]; else s[k]=v; SS.set('sel',ST.sel); }
    const y=document.getElementById('filters')?document.getElementById('filters').scrollTop:0; render(); const f=document.getElementById('filters'); if(f) f.scrollTop=y; }
});
render();
fxInit();
</script>
