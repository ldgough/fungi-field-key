<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fungi Field Key</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3d5c2b">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
/* Field app shell, pipeline template v5 (10 Nov 2026, Session 5): look-alike tables lead with the key difference, carry a photo strip, link to the species and appear on each compared species page. v4 (10 Nov 2026): adds finds and forays, form-specific genus characters and omitted fields for non-gilled groups. Earlier: v3. Phone first: app bar, one column, filters in a bottom sheet; two columns from 900px. */
:root{
  --paper:#f5f6f2; --sheet:#ffffff; --ink:#1c1f1a; --muted:#5a6157; --rule:#dadfd5;
  --lilac:#3d5c2b; --lilac-soft:#e5eddc;
  --banner:#a53a32; --ok:#2f7a45; --ok-bg:#e3f2e7; --warn:#9a6200; --warn-bg:#fbefd8; --bad:#a53a32; --bad-bg:#f8e2df;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h:52px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141712; --sheet:#1d211b; --ink:#e9ede5; --muted:#a3ab9e; --rule:#323a2e; --lilac:#a7c98c; --lilac-soft:#22301a;
  --banner:#7a2a24; --ok:#7cc792; --ok-bg:#1d3324; --warn:#e4b35a; --warn-bg:#3a2d14; --bad:#ec8b82; --bad-bg:#3d1f1c; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#141712; --sheet:#1d211b; --ink:#e9ede5; --muted:#a3ab9e; --rule:#323a2e; --lilac:#a7c98c; --lilac-soft:#22301a;
  --banner:#7a2a24; --ok:#7cc792; --ok-bg:#1d3324; --warn:#e4b35a; --warn-bg:#3a2d14; --bad:#ec8b82; --bad-bg:#3d1f1c; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,6vw,36px)} h2{font-size:20px} h3{font-size:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;height:var(--bar-h);display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--lilac-soft)}
.iconbtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.bar-title{flex:1;min-width:0;font-family:var(--f-display);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn-strip{background:var(--banner);color:#fff;font-size:13px;line-height:1.35;padding:6px max(16px,env(safe-area-inset-left,0px));text-align:center}
.warn-strip a{color:#fff}
.page{max-width:1100px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.crumbs{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs .on{color:var(--lilac);font-weight:600}
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.forms{grid-template-columns:repeat(4,minmax(0,1fr))}}
.formbtn{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:12px;min-height:64px;cursor:pointer;font-size:14.5px;line-height:1.3}
.formbtn[aria-pressed="true"]{border-color:var(--lilac);box-shadow:inset 0 0 0 1.5px var(--lilac);background:var(--lilac-soft)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
details.panel>summary{cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;list-style-position:outside}
.keygrid{display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.keygrid{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start;gap:22px}
  .filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 12px);max-height:calc(100vh - var(--bar-h) - 40px);overflow:auto}
  .sheetbar,.sheet-head .done{display:none!important}}
@media (max-width:899px){
  .filters{position:fixed;inset:auto 0 0 0;z-index:40;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;border-bottom:0;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s ease}
  .filters.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35)}
}
@media (prefers-reduced-motion:reduce){.filters{transition:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-16px;background:var(--sheet);padding:4px 0 8px;z-index:1}
.linkbtn{border:0;background:none;color:var(--lilac);cursor:pointer;text-decoration:underline;padding:8px 4px;font-size:14px}
.done{border:0;border-radius:8px;background:var(--lilac);color:var(--sheet);font-weight:600;padding:10px 16px;cursor:pointer}
.char{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--rule)}
.char-q{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:8px 12px;min-height:40px;font-size:14px;cursor:pointer;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--lilac);color:var(--sheet);border-color:var(--lilac)}
.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.sheetbar .sum{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;min-width:0}
.resultsum{font-size:14px;color:var(--muted);margin:0}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:10px;cursor:pointer}
.card:hover{border-color:var(--lilac)}
.card.dim{opacity:.5}
.thumb{width:84px;height:84px;flex:none;border-radius:8px;object-fit:cover;background:var(--lilac-soft)}
.thumb.txt{display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:13px;text-align:center;padding:4px;line-height:1.2}
.cmeta{min-width:0;display:flex;flex-direction:column;gap:4px}
.names{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.latin{font-family:var(--f-display);font-style:italic;color:var(--muted)}
.spot{margin:0;font-size:14px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--lilac-soft);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.match{font-size:12.5px;color:var(--muted)} .match b{color:var(--warn)} .match .fit{color:var(--ok)}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.gallery figure{margin:0;flex:0 0 86%;max-width:520px;scroll-snap-align:center;display:flex;flex-direction:column;gap:4px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--lilac-soft)}
.gallery figcaption{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.box{border-left:3px solid var(--lilac);background:var(--lilac-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.box.bad{border-color:var(--bad);background:var(--bad-bg)} .box.warn{border-color:var(--warn);background:var(--warn-bg)}
.box ul{margin:4px 0 0;padding-left:18px}
.facts{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:700px){.facts{grid-template-columns:1fr 1fr;column-gap:24px}}
.fact{padding:10px 0;border-top:1px solid var(--rule);min-width:0}
.fact h4{margin:0 0 3px;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--lilac);font-weight:500}
.fact p,.fact ul,.fact dl{margin:0;font-size:15px}
.fact ul{padding-left:18px}
.fact dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px} .fact dt{color:var(--muted)} .fact dd{margin:0}
.nr{color:var(--muted);font-style:italic}
sup.s{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px;min-width:520px;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600}
.cmp th.dz,.cmp td.dz{background:var(--bad-bg)}
.cmp tr.key td{background:var(--lilac-soft);font-weight:600}
.cmp tr.key td.dz{background:var(--bad-bg)}
.cmp th a{color:inherit}
.cmpph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 8px}
.cmpph figure{margin:0;display:flex;flex-direction:column;gap:3px}
.cmpph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--lilac-soft)}
.cmpph figcaption{font-size:12.5px;line-height:1.3}
.cmph{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.menu{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:50;background:var(--sheet);border-right:1px solid var(--rule);
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;overflow:auto}
.menu a,.menu button.mi{display:block;text-align:left;width:100%;padding:12px;border-radius:8px;color:var(--ink);text-decoration:none;border:0;background:none;cursor:pointer;font-size:16px}
.menu a:hover,.menu button.mi:hover{background:var(--lilac-soft)}
.menu .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;font-size:15px}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.srcs code{font-family:var(--f-mono);font-size:11.5px;color:var(--lilac);margin-right:6px}
a{color:var(--lilac)}
.chip.hasicon{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:6px 8px;min-width:76px;text-align:center}
.chip .sk{width:52px;height:39px}
.chip .sw{width:22px;height:22px}
.sk{display:block;overflow:visible}
.sk .k-cap{fill:var(--lilac-soft);stroke:var(--ink);stroke-width:1.2}
.sk .k-stem{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.sk .k-gill{fill:var(--lilac);fill-opacity:.55;stroke:var(--ink);stroke-width:1}
.sk .k-line{stroke:var(--ink);stroke-width:1;fill:none}
.sk .k-ridge{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.sk .k-ring{fill:var(--lilac);fill-opacity:.55;stroke:var(--ink);stroke-width:1.1}
.sk .k-web{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2;fill:none}
.sk .k-rim{stroke:var(--ink);stroke-width:1.4;fill:none}
.sk .k-dot{fill:var(--ink)}
.sk .k-soil{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.sw{display:inline-block;border-radius:50%;border:1px solid var(--rule)}
.sw.big{width:44px;height:44px}
.glgroup h3{font-size:16px;margin-bottom:8px}
.glrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.gl{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gl .sk{width:100px;height:75px}
.gl figcaption{font-size:12.5px;color:var(--muted)}

/* Finds and forays, v001 (10 Nov 2026) */
.fx-form{display:flex;flex-direction:column;gap:14px}
.fx-row{display:flex;flex-direction:column;gap:4px}
.fx-row label,.fx-lab{font-weight:600;font-size:14px}
.fx-row .hint{font-size:12.5px;color:var(--muted)}
.fx-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fx-in,.fx-sel,.fx-ta{font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px;width:100%;min-height:44px}
.fx-ta{min-height:84px;resize:vertical}
.fx-check{display:flex;align-items:center;gap:8px;font-size:15px;min-height:40px}
.fx-check input{width:20px;height:20px}
.fx-btns{display:flex;flex-wrap:wrap;gap:8px}
.btn2{border:1px solid var(--lilac);border-radius:8px;background:var(--sheet);color:var(--lilac);font-weight:600;padding:10px 14px;cursor:pointer;min-height:44px}
.btn2.danger{border-color:var(--bad);color:var(--bad)}
.done[disabled],.btn2[disabled]{opacity:.5;cursor:default}
.fx-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fx-photo{position:relative;margin:0}
.fx-photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--lilac-soft);display:block}
.fx-photo figcaption{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.fx-photo .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.fx-add{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--lilac);border-radius:8px;color:var(--lilac);font-weight:600;cursor:pointer;text-align:center;font-size:13.5px;padding:6px}
.fx-add input{}
.fx-status{font-size:13.5px;color:var(--muted)}
.fx-kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:15px}
.fx-kv dt{color:var(--muted)} .fx-kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fx-map{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;touch-action:manipulation}
.fx-map .g1{stroke:var(--rule);stroke-width:1}
.fx-map .g2{stroke:var(--muted);stroke-width:1;stroke-opacity:.5}
.fx-map .gl{fill:var(--muted);font:16px var(--f-mono)}
.fx-map .pt{fill:var(--lilac);stroke:var(--sheet);stroke-width:2;cursor:pointer}
.fx-map .pn{fill:var(--sheet);font:600 16px var(--f-body);pointer-events:none}
.fx-map .sb{stroke:var(--ink);stroke-width:2}
.fx-map .sbt{fill:var(--ink);font:16px var(--f-mono)}
.fx-spp{width:100%;min-width:0}
.fx-spp td:first-child{white-space:nowrap}
.fx-empty{border:1px dashed var(--rule);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.fx-conf{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px}
.fx-conf.certain{background:var(--ok-bg);color:var(--ok)} .fx-conf.probable{background:var(--lilac-soft);color:var(--lilac)}
.fx-conf.possible{background:var(--warn-bg);color:var(--warn)} .fx-conf.unknown{background:var(--rule);color:var(--muted)}
.fx-tabs{display:flex;gap:6px;flex-wrap:wrap}
.fx-tabs a{padding:8px 12px;border-radius:999px;border:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:14px}
.fx-tabs a.on{background:var(--lilac);border-color:var(--lilac);color:var(--sheet)}
.ill{--ill-fill:var(--lilac-soft);--ill-accent:var(--lilac);--ill-paper:var(--sheet);--ill-ground:var(--muted);--ill-dark:#3b3a33;
  color:var(--ink);display:block;flex:none}
.dk .ill,:root[data-theme="dark"] .ill{--ill-dark:#6a6456}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ill{--ill-dark:#6a6456}}

/* Hero */
.hero{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;border-radius:16px;
  background:linear-gradient(180deg,var(--lilac-soft),var(--sheet) 70%);border:1px solid var(--rule);overflow:hidden}
.hero .ill{width:100%;height:auto;max-height:120px;margin:-4px 0 4px;opacity:.95}
.hero h1{font-size:clamp(30px,9cqi,44px);letter-spacing:-.01em}
.hero-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sec{font-size:20px}

/* Form chooser cards with illustration */
.forms2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.page,.mpage{container-type:inline-size}
@container (min-width:640px){.forms2{grid-template-columns:repeat(4,minmax(0,1fr))}}
.formcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:14px;padding:10px 12px 12px;min-height:150px;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.formcard .ill{width:64px;height:64px;margin-bottom:4px}
.formcard .fc-t{font:600 16px/1.2 var(--f-display)}
.formcard .fc-d{font-size:12.5px;line-height:1.3;color:var(--muted)}
.formcard:hover{border-color:var(--lilac);transform:translateY(-1px);box-shadow:0 4px 14px rgb(0 0 0/.06)}
.formcard[aria-pressed="true"]{border-color:var(--lilac);box-shadow:inset 0 0 0 1.5px var(--lilac);background:var(--lilac-soft)}
@media (prefers-reduced-motion:reduce){.formcard{transition:none}.formcard:hover{transform:none}}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 18px;
  border:1.5px dashed var(--rule);border-radius:16px;background:var(--sheet)}
.empty .ill{width:160px;height:120px;margin-bottom:4px}
.empty h2{font-size:22px} .empty p{margin:0 0 6px;color:var(--muted);max-width:34ch;font-size:15px}

/* Session 4b: quick recording */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;flex:none}
.fx-snap{display:flex;flex-direction:column;gap:6px}
.snapbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;background:var(--lilac);color:var(--sheet);font-weight:600;font-size:18px;cursor:pointer}
.snapbtn .ico{width:28px;height:28px}
.snapbtn input,.fab input,.fx-add input,label.btn2 input,.fx-snap-alt input,.hero-acts label input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.snapbtn,.fab,.fx-add,label.btn2,.fx-snap-alt label,.hero-acts label{position:relative}
.snapbtn:focus-within,.fab:focus-within,.fx-add:focus-within,label.btn2:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.fx-snap-alt{display:flex;gap:14px;justify-content:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:62px;height:62px;border-radius:50%;
  background:var(--lilac);color:var(--sheet);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}

@media (min-width:900px){.fab{bottom:24px}}

form": ["gills"], "spore": ["black"], "attach": [], "veil": ["none", "ring"], "size": ["small", "large"], "milk": ["no"], "substrate": ["dung", "grass"], "cluster": [], "snap": ["brittle", "fragile"], "underside": ["gills"]}, "facts": {"Cap": ["0.5 to 7 cm; pale or dull; usually strongly hygrophanous; some with scales or hanging veil fragments at the margin; flesh fragile.", ["McA"]], "Gills": ["Mottled (marbled) as the spores ripen; some species with a coloured edge.", ["McA"]], "Stem": ["Very slender, fragile, snapping cleanly; with or without a ring.", ["McA"]], "Spore print": ["Black (McAdam spore colour 5).", ["McA"]], "Smell": ["Not given by McAdam.", []], "Habitat": ["Grassland and dung (not stated by McAdam for every species).", ["McA"]]}, "ukspp": ["9 (CBIB, per McAdam)", ["McA"]], "safety": null, "built": null, "keys": [], "inat": 1505, "spot": "Slender grassland caps with mottled black gills."}, {"id": "stropharia", "name": "Stropharia", "english": "Roundheads", "traits": {"form": ["gills"], "spore": ["black", "dullbrown"], "attach": ["adnate", "adnexed"], "veil": ["ring"], "size": ["large", "small"], "milk": ["no"], "substrate": ["soil", "grass", "dung", "wood"], "cluster": [], "snap": [], "underside": ["gills"]}, "facts": {"Cap": ["1 to 15 cm; often viscid; pale, ochre-yellow, greenish-blue, wine-red or orange-red.", ["McA"]], "Gills": ["Adnate or adnexed; edges often whitish and fringed.", ["McA"]], "Stem": ["Ring present, thick and fleshy or thin and brittle.", ["McA"]], "Spore print": ["Fresh spores lilac to grey-lilac (McAdam spore colour 5).", ["McA"]], "Smell": ["Not given by McAdam.", []], "Habitat": ["Soil, dung, decaying wood or sawdust, in woods or meadows.", ["McA"]]}, "ukspp": ["17 (CBIB, per McAdam)", ["McA"]], "safety": null, "built": null, "keys": [], "inat": null, "spot": "Slimy, often coloured caps with a ring and dark purple-brown spores."}, {"id": "agrocybe", "name": "Agrocybe", "english": "Fieldcaps", "traits": {"form": ["gills"], "s ts": {"form": ["gills"], "spore": ["brightbrown"], "attach": [], "veil": ["none", "ring"], "size": ["small"], "milk": ["no"], "substrate": ["grass", "soil", "dung"], "cluster": [], "snap": [], "underside": ["gills"]}, "facts": {"Cap": ["0.5 to 3 cm; conical, bell-shaped or convex; usually tawny, rust or ochre brown, with a frosted sheen.", ["McA"]], "Gills": ["Not described separately by McAdam.", []], "Stem": ["Finely powdery under a lens when young; slender.", ["McA"]], "Spore print": ["Rust brown to yellowish brown.", ["McA"]], "Smell": ["Not given by McAdam.", []], "Habitat": ["Soil in woods or pasture, dung, occasionally wood.", ["McA"]]}, "ukspp": ["67 (CBIB, per McAdam)", ["McA"]], "safety": null, "built": null, "keys": ["BMS Conocybe key"], "inat": null, "spot": "Small tawny cone-shaped caps in grass; rust spores."}, {"id": "lepista", "name": "Lepista", "english": "Blewits", "traits": {"form": ["gills"], "spore": ["pink"], "attach": ["notched", "adnate", "decurrent"], "veil": ["none"], "size": ["large"], "milk": ["no"], "substrate": ["soil", "grass"], "cluster": [], "snap": [], "underside": ["gills"]}, "facts": {"Cap": ["2 to 25 cm; Tricholoma- or Clitocybe-like; white, dull pink, tan, violet or vinaceous brown.", ["McA"]], "Gills": ["Notched to adnate or decurrent, very crowded to medium spaced, can be separated from the cap; white, pale ochre, beige or bluish, often pinkish when old.", ["FN08-lepista"]], "Stem": ["Cylindrical, with a somewhat bulbous or tapering base.", ["FN08-lepista"]], "Spore print": ["Very pale dirty or creamy pink, usually pinkish buff.", ["McA"]], "Smell": ["Not given by McAdam.", []], "Habitat": ["Ground in woods, compost, gardens, lawns and parks.", ["McA"]]}, "ukspp": ["11 (CBIB, per McAdam)", ["McA"]], "safety": null, "built": null, "keys": [], "inat": null, "spot": "Fleshy violet or tan caps; pinkish-buff spore print. iNaturalist now files the Wood Blewit under Collybia (Collybia nuda)."}, {"id": "paxillus", "name": "Paxillus", "english": "Rollrims", "traits": {"form": ["gills"], "spore": ["dullbrown"], "attach": ["decurrent"], "veil": ["none"], "size": ["large"], "milk": ["no"], "substrate": ["soil"], "cluster": [], "snap": [], "underside": ["gills"]}, "facts": {"Cap": ["Funnel-shaped, with an inrolled margin when young; felty to velvety, often smooth when old.", ["FN08-paxillus"]], "Gills": ["Decurrent, yellowish brown, joined by cross-connections near the stem, easily detached from the cap, bruising brown.", ["FN08-paxillus"]], "Stem": ["Central, short.", ["FN08-paxillus"]], "Spore print": ["Dark yellowish brown to cocoa brown.", ["McA"]], "Smell": ["Indistinct; taste mild.", ["FN08-paxillus"]], "Habitat": ["On soil, usually mycorrhizal.", ["McA"]]}, "ukspp": ["2 (CBIB, per McAdam)", ["McA"]], "safety": ["Brown Rollrim (P. involutus) is toxic and can be deadly: repeated eating can trigger a sudden immune reaction with haemolytic anaemia.", ["FN-paxillus-involutus"]], "built": null, "keys": [], "inat": 857, "spot": "Decurrent gills and dark yellowish to cocoa-brown spores, on soil."}, {"id": "cantharellus", "name": "Cantharellus and Hygrophoropsis", "english": "Chanterelles and false chanterelles", "traits": {"form": ["gills"], "spore": ["white"], "attach": ["decurrent"], "veil": [], "size": ["large", "small"], "milk": ["no"], "substrate": ["soil", "wood"], "cluster": [], "snap": [], "underside": ["ridges", "gills"]}, "facts": {"Cap": ["Cantharellus: small to medium. Hygrophoropsis: 0.5 to 10 cm, white, yellow, orange-yellow, ochre-pink or brown, soft, not viscid.", ["McA"]], "Gills": ["Cantharellus: forked ridges, the cap colour, decurrent. Hygrophoropsis: true gills, decurrent, thin, forking.", ["McA"]], "Stem": ["Not described separately by McAdam.", []], "Spore print": ["Pale; keyed under McAdam spore colour 1 (white to pale cream).", ["McA"]], "Smell": ["Not given by McAdam.", []], "Habitat": ["Cantharellus: soil with conifers and broadleaf trees. Hygrophoropsis: ground and decayed, se.", "s": ["K23", "FN-submembranacea"]}], "smell": [{"t": "Not distinctive.", "s": ["FN-submembranacea"]}], "habitat": [{"t": "See Sources differ below.", "s": ["K23", "FN-submembranacea"]}], "season": [{"t": "July to October (First Nature); Kibby's illustrated collections are from October.", "s": ["FN-submembranacea", "K23"]}], "frequency": [{"t": "See Sources differ below. 33 UK iNaturalist records.", "s": ["INAT"]}], "lookalikes": [{"t": "A. olivaceogrisea: much smaller and more slender; wet shady woods, often near hazel; narrow gill trama under the microscope.", "s": ["K23"]}, {"t": "A. reidiana (formerly var. bispora): darker chestnut-brown cap, mostly 2-spored basidia; upland conifer woods; recorded in Scotland and Shropshire.", "s": ["K23", "CBIB"]}, {"t": "Snakeskin Grisette: substantial volva that collapses early; strongly lined olive-fawn cap.", "s": ["FN-submembranacea", "FN-ceciliae"]}], "micro": [{"t": "Spores subglobose to globose, about 9.5 to 13.0 x 9.0 to 12.0 µm (Kibby); roughly spherical, 10 to 14 µm (First Nature). Volval tissue filamentous outside, with large sphaerocysts inside.", "s": ["K23", "FN-submembranacea"]}], "conflicts": [{"t": "Habitat: Kibby (2023) says mixed deciduous woods, particularly with oak and beech; First Nature says mainly coniferous forest with fir, larch and spruce, occasionally birch. Contu (2003) gives conifers. Funga Nordica (2008) gives conifers and deciduous trees, especially spruce, which accommodates both views.", "s": ["K23", "FN-submembranacea", "C03", "FN08"]}, {"t": "Frequency: Kibby says less common but locally frequent in parts of southern England; First Nature says very uncommon to rare.", "s": ["K23", "FN-submembranacea"]}, {"t": "Volva: Kibby describes it as rather thick; First Nature as thin and leathery.", "s": ["K23", "FN-submembranacea"]}], "spore": {"t": "White", "s": ["FN-submembranacea"]}, "ring": {"t": "None.", "s": ["K23", "FN-submembranacea"]}, "volva": {"t": "Thick with flared upper edges; white or cream at first, soon flushed grey, especially on the inner surface (Kibby). First Nature describes it as thin and leathery, greying and hardening like flaking grey paint.", "s": ["K23", "FN-submembranacea"]}, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Free", "s": ["FN-submembranacea"]}, "spacing": {"t": "Moderately crowded; many short gills", "s": ["FN-submembranacea"]}, "edge": null, "colour": {"t": "Cream, becoming grey or brownish with age", "s": ["K23", "FN-submembranacea"]}, "other": null}, "genus": {"veil": {"t": "Often a grey central patch", "s": ["K23", "FN-submembranacea"]}, "margin": {"t": "Strongly lined", "s": ["K23", "FN-submembranacea"]}, "redden": null, "base": {"t": "Slightly swollen at most", "s": ["FN-submembranacea"]}}, "photos": [{"file": "Amanita/images/Amanita_submembranacea_1_iNat758520211.jpg", "licence": "CC-BY-NC", "status": "Amber", "status_note": "Non-commercial licence: personal or non-commercial use only", "attribution": "(c) Liz Downey, some rights reserved (CC BY-NC)", "url": "https://www.inaturalist.org/observations/412247775", "region": "UK", "flag": "Greying volva and banded stem.", "replace": false, "base": true}, {"file": "Amanita/images/Amanita_submembranacea_2_iNat102323252.jpg", "licence": "CC-BY-NC", "status": "Amber", "status_note": "Non-commercial licence: personal or non-commercial use only", "attribution": "(c) AJ, some rights reserved (CC BY-NC)", "url": "https://www.inaturalist.org/observations/63725872", "region": "UK", "flag": "Volva and stem.", "replace": false, "base": true}, {"file": "Amanita/images/Amanita_submembranacea_3_iNat580655636.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) ikelman, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/321097274", "region": "UK", "flag": "Striate cap and base.", "replace": false, "base": true}]}, {"id": "vaginata", "latin": "Amanita vaginata", "author": "(Bull.) Fr.", "english": "Grisette", "section": "Vaginatae", "field_id": "No: name now ill-defined", "field_note": "Record grey ringless Amanitas as 'Amanita section Vaginatae, grey cap' unless microscopy or DNA settles the species. Several silvery-grey species occur in Britain, including A. alseides, A. huijsmanii, A. vladimirii and A. argentea.", "spot": "Grey cap with a lined margin and a small boss; no ring; white stem in a white sac-like volva. Treat the name as a group label.", "tox": "toxicraw", "safety": "First Nature calls it edible but not prized; grisettes are easily confused with the Deathcap and other poisonous Amanitas.", "safety_src": ["FN-vaginata"], "no_photo": "iNaturalist currently treats the name Amanita vaginata as section Vaginatae (checked 9 November 2026), so no species-level photographs could be taken. This is consistent with Kibby and Rogerson's warning that the name has no well-defined concept.", "traits": {"ring": ["absent"], "volva": ["sac"], "base": ["slender"], "veil": ["none"], "capcol": ["grey"], "margin": ["striate"], "smell": ["none"], "stempat": ["smooth"], "trees": ["broadleaf", "conifer"]}, "cap": [{"t": "5 to 10 cm; grey, usually without veil remnants; egg-shaped, then flat with a small boss; margin lined.", "s": ["FN-vaginata"]}, {"t": "Contu's broad concept: grey, bistre-grey to brownish grey, very variable, with conifers and broadleaf trees.", "s": ["C03"]}], "gills": [], "stem": [{"t": "12 to 20 cm x 1 to 1.5 cm, tapering slightly upwards; white or tinged with the cap colour; becomes hollow.", "s": ["FN-vaginata"]}], "smell": [{"t": "Not distinctive.", "s": ["FN-vaginata"]}], "habitat": [{"t": "Ectomycorrhizal in broadleaf, occasionally mixed, woodland.", "s": ["FN-vaginata"]}], "season": [{"t": "July to October.", "s": ["FN-vaginata"]}], "frequency": [{"t": "Not meaningful at present: records under this name cover several species.", "s": ["KR21"]}], "lookalikes": [{"t": "A. alseides: grey to brownish-grey cap, strongly lined; fragile volva greying outside; under oak on clay or calcareous soil.", "s": ["KR21", "CBIB"]}, {"t": "A. huijsmanii: rounded silver-grey cap; tough, mainly filamentous volva; with oak and sweet chestnut.", "s": ["KR21", "CBIB"]}, {"t": "Snakeskin Grisette: grey veil patches; snakeskin stem.", "s": ["FN-vaginata"]}, {"t": "Deathcap and other ringed species: always check for a ring and an unlined margin.", "s": ["FN-vaginata", "FN-phalloides"]}], "micro": [{"t": "Spores spherical, smooth, 8 to 12 µm; inamyloid; basidia 4-spored (First Nature). Kibby and Rogerson advise using the Hanss and Moreau key and DNA sequencing for silvery-grey collections.", "s": ["FN-vaginata", "KR21"]}], "conflicts": [{"t": "Concept: First Nature describes A. vaginata as a single grey species. Kibby and Rogerson (2021) call it a catch-all name with no well-defined concept, originally described as white-capped; iNaturalist resolves the name to section Vaginatae. Funga Nordica (2008) keys A. vaginata f. vaginata as a grey-capped species with a white to pale greyish sac-like volva, under deciduous trees, especially beech; this matches First Nature's working concept but predates the British revision reported by Kibby and Rogerson.", "s": ["FN-vaginata", "KR21", "INAT", "FN08"]}, {"t": "Number of British grisettes: 14 recorded in 2003 (Kibby); about 18 in 2023 (Overall).", "s": ["K03", "O23"]}], "spore": {"t": "White", "s": ["FN-vaginata"]}, "ring": {"t": "None.", "s": ["FN-vaginata"]}, "volva": {"t": "Large, white, sac-like.", "s": ["FN-vaginata", "C03"]}, "flesh": {"t": "White and firm under the cap skin.", "s": ["FN-vaginata"]}, "chem": null, "gillspec": {"attachment": {"t": "Adnexed or sometimes free", "s": ["FN-vaginata"]}, "spacing": {"t": "Crowded", "s": ["FN-vaginata"]}, "edge": null, "colour": {"t": "White", "s": ["FN-vaginata", "C03"]}, "other": null}, "genus": {"veil": {"t": "Usually none", "s": ["FN-vaginata"]}, "margin": {"t": "Lined", "s": ["FN-vaginata"]}, "redden": nul ps or troops"}, {"v": "single", "label": "Singly"}]}, {"key": "cap", "q": "Cap width (largest)", "opts": [{"v": "small", "label": "Under 1.5 cm"}, {"v": "medium", "label": "1.5 to 3 cm"}, {"v": "large", "label": "Over 3 cm"}]}, {"key": "colour", "q": "Cap colour", "opts": [{"v": "greybrown", "label": "Grey or grey-brown"}, {"v": "pinklilac", "label": "Pink or lilac"}, {"v": "reddish", "label": "Pinkish or reddish brown"}, {"v": "olive", "label": "Olive, yellowish or cream"}, {"v": "orange", "label": "Orange tones or spots"}, {"v": "white", "label": "White"}, {"v": "bluegrey", "label": "Blue-grey or steel grey"}]}, {"key": "juice", "q": "Snap the stem: any juice?", "opts": [{"v": "none", "label": "None"}, {"v": "white", "label": "White milk"}, {"v": "red", "label": "Dark red"}, {"v": "orange", "label": "Saffron orange"}]}, {"key": "smell", "q": "Crush the cap: smell?", "opts": [{"v": "none", "label": "Nothing distinctive"}, {"v": "radish", "label": "Radish"}, {"v": "bleach", "label": "Bleach or nitrous"}, {"v": "rancid", "label": "Rancid or mealy"}, {"v": "iodine", "label": "Iodine, as it dries"}, {"v": "radishs", "label": "Strong radish, as Lilac Bonnet"}]}, {"key": "stem", "q": "Stem feature", "opts": [{"v": "yellow", "label": "Lemon-yellow and slimy"}, {"v": "orangebase", "label": "Orange-brown towards base"}, {"v": "lilacbase", "label": "Lilac-grey towards base"}, {"v": "pale", "label": "Pale, white or grey"}, {"v": "tough", "label": "Tough and polished"}, {"v": "grooved", "label": "Fine lengthwise grooves"}]}, {"key": "gattach", "q": "How do the gills meet the stem?", "opts": [{"v": "free", "label": "Free (not touching)"}, {"v": "adnexed", "label": "Adnexed (narrowly attached)"}, {"v": "adnate", "label": "Adnate (broadly attached)"}, {"v": "sinuate", "label": "Sinuate (notched)"}, {"v": "tooth", "label": "With a decurrent tooth"}, {"v": "decurrent", "label": "Running down the stem"}]}, {"key": "gspace", "q": "Gill spacing", "opts": [{"v": "crowded", "label": "Crowded"}, {"v": "distant", "label": "Distant or fairly spaced"}]}, {"key": "gedge", "q": "Gill edge (hand lens)", "opts": [{"v": "same", "label": "Same colour as face"}, {"v": "darker", "label": "Darker or coloured"}, {"v": "paler", "label": "Paler than face"}, {"v": "toothed", "label": "Finely toothed"}]}, {"key": "gveins", "q": "Cross-veins between gills?", "opts": [{"v": "yes", "label": "Yes, visible against light"}]}], "primer": [{"t": "Substrate first", "d": "Note exactly what it grows on before picking: stump, fallen branch, buried twig, leaf or needle litter, grass or moss, and which trees are near.", "src": ["I"]}, {"t": "Snap the stem", "d": "Break the stem near the base on a fresh specimen. White milk, dark red or orange juice each narrow the choice to one or two species.", "src": ["I"]}, {"t": "Smell straight away", "d": "Crush a cap and smell at once: radish, bleach, rancid-mealy. Iodine only appears later, as the specimen dries in its box.", "src": ["I"]}, {"t": "Look at the gill edge", "d": "Use a hand lens. A coloured edge (red, yellow, brown) is important in several grey species.", "src": ["I"]}, {"t": "Check stem colour and base", "d": "Yellow and slimy, orange-brown below, lilac-grey below, a hairy base or a basal disc are all useful.", "src": ["I"]}, {"t": "Feel the cap", "d": "A sticky cap with a skin that peels away points to the slimy-capped group.", "src": ["I"]}], "compare": [{"title": "Lilac Bonnet and Blackedge Bonnet", "cols": ["Lilac Bonnet", "Blackedge Bonnet"], "ids": ["pura", "pelianthina"], "rows": [{"label": "Key difference", "cells": [{"t": "Gill edge the same colour as the face", "s": ["FN-pura"]}, {"t": "Gill edge dark purple to black (hand lens)", "s": ["FN-pelianthina", "FN08"]}]}, {"label": "Cap", "cells": [{"t": "Lilac, pink or white; 2 to 5 cm", "s": ["FN-pura"]}, {"t": "Pinkish buff to pale lilac, fading; 1.5 to 5 cm", "s": ["FN-pelianthina"]}]}, {"label": "Smell", "cells": [{"t": "Radish", "s": ["FN-pura"]}, {"t": "Strong radish", "s": ["FN-pelianthina"]}]}, {"label": "Habitat", "cells": [{"t": "Broadleaf and conifer litter", "s": ["FN-pura"]}, {"t": "Broadleaf litter, especially beech", "s": ["FN-pelianthina", "FN08"]}]}]}, {"title": "Common Bonnet and Grooved Bonnet", "cols": ["Common Bonnet", "Grooved Bonnet"], "ids": ["galericulata", "polygramma"], "rows": [{"label": "Key difference", "cells": [{"t": "Stem smooth and polished", "s": ["FN-galericulata", "I"]}, {"t": "Stem with fine lengthwise grooves", "s": ["FN-polygramma", "FN08"]}]}, {"label": "Gills", "cells": [{"t": "Joined by cross-veins; pinkish with age", "s": ["FN-galericulata", "I"]}, {"t": "No cross-veins noted; pinkish grey with age", "s": ["FN-polygramma"]}]}, {"label": "Habit", "cells": [{"t": "Single, in groups or clustered", "s": ["FN-galericulata", "I"]}, {"t": "Single or in small groups", "s": ["FN-polygramma"]}]}]}, {"title": "Burgundydrop Bonnet and Bleeding Bonnet", "cols": ["Burgundydrop Bonnet", "Bleeding Bonnet"], "ids": ["haematopus", "sanguinolenta"], "rows": [{"label": "Key difference", "cells": [{"t": "Larger, in tufts on rotten broadleaf wood", "s": ["FN-haematopus", "I"]}, {"t": "Small, on litter or in moss, often with conifers", "s": ["C", "FN08"]}]}, {"label": "Juice", "cells": [{"t": "Dark red", "s": ["FN-haematopus", "I"]}, {"t": "Watery, pinkish to brownish red", "s": ["C", "FN08"]}]}, {"label": "Gill edge", "cells": [{"t": "Often darker than the face", "s": ["FN-haematopus"]}, {"t": "Dark red-brown", "s": ["FN08", "C"]}]}]}, {"title": "Snapping Bonnet and Iodine Bonnet", "cols": ["Snapping Bonnet", "Iodine Bonnet"], "ids": ["vitilis", "filopes"], "rows": [{"label": "Key difference", "cells": [{"t": "Gill edge finely toothed; no smell", "s": ["FN-vitilis", "C"]}, {"t": "Gill edge smooth; iodine smell as it dries", "s": ["C"]}]}, {"label": "Stem", "cells": [{"t": "Springy; snaps audibly when stretched", "s": ["FN-vitilis"]}, {"t": "Fragile and hollow", "s": ["C"]}]}]}], "photos_have_base": false, "species": [{"id": "galericulata", "latin": "Mycena galericulata", "author": "(Scop.) Gray", "english": "Common Bonnet", "section": "Mycena", "field_id": "Usually", "field_note": "Separate from M. polygramma (grooved stem) and M. inclinata (oak clusters, rancid smell).", "spot": "The largest common bonnet: a tough, polished stem and gills joined by cross-veins, on dead broadleaf wood in any month.", "traits": {"substrate": ["wood", "buried"], "trees": ["broadleaf", "oak", "beech", "conifer"], "habit": ["cluster", "group", "single"], "cap": ["medium", "large"], "colour": ["greybrown", "reddish"], "juice": ["none"], "smell": ["none"], "stem": ["tough", "pale"], "gattach": ["adnate", "sinuate"], "gspace": ["distant"], "gveins": ["yes"]}, "fn": "mycena-galericulata", "wfu": "common-bonnet", "src_fn": {"label": "First Nature: Mycena Galericulata", "url": "https://www.first-nature.com/fungi/mycena-galericulata.php"}, "src_wfu": {"label": "Wild Food UK: Common Bonnet", "url": "https://www.wildfooduk.com/mushroom-guide/common-bonnet/"}, "cap": [{"t": "2 to 6 cm, occasionally to 8 cm. Conical at first, then bell-shaped, finally flattened with a broad shallow boss like a wide-brimmed bonnet. Grey-brown, paling with age to beige, sometimes pinkish; striate at the margin.", "s": ["FN", "C", "I"]}], "gills": [{"t": "White to pale grey, becoming creamy pink with age. Cross-veins join the gills; hold the cap up to the light to see them on mature caps.", "s": ["FN", "I", "WFU"]}], "stem": [{"t": "5 to 10 cm, tough, smooth and shiny; grey when young, paling with age; base finely woolly.", "s": ["FN", "I"]}], "smell": [{"t": "Not distinctive.", "s": ["FN", "I"]}], "habitat": [{"t": "On stumps, trunks and fallen branches of broadleaf trees, occasionally conifers; also from buried wood in litter, sometimes in rows along old roots. Single, in groups or clustered.", "s": ["FN", "I", "C"]}], "season": [{"t": "All year; most frequent June to November.", "s": ["C", "I", "WFU", "FN"]}], "frequency": [{"t": "Very common. 11,176 FRDBI records to 2015, the highest count in Cullington's list.", "s": ["C"]}], "lookalikes": [{"t": "M. polygramma: darker grey, stem with fine silvery grooves; later in the season.", "s": ["I", "FN"]}, {"t": "M. inclinata: dense clusters on oak, stem orange-brown below, rancid smell.", "s": ["I"]}, {"t": "M. arcangeliana: develops an iodine smell as it dries.", "s": ["FN"]}], "micro": [{"t": "Spores broadly ellipsoid, 9 to 12 x 6 to 8.5 µm, amyloid. Basidia mainly 2-spored. Cheilocystidia to 55 µm, irregular, with thin finger-like outgrowths; pleurocystidia absent.", "s": ["FN", "C"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": {"t": "None", "s": ["FN"]}, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate or sinuate", "s": ["FN"]}, "spacing": {"t": "Fairly widely spaced", "s": ["WFU"]}, "edge": null, "colour": {"t": "White or pale grey, becoming pinkish grey to creamy pink with age", "s": ["FN", "I"]}, "other": {"t": "Cross-veins between the gills on mature caps; short gills of three or four lengths", "s": ["FN", "I", "C"]}}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_galericulata_1_iNat275756320.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Nigel Voaden, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/159599034", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_galericulata_2_iNat334581714.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Viktor, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/190811147", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_galericulata_3_iNat331721816.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) ikelman, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/189372041", "region": "UK", "flag": "", "replace": false, "base": null}]}, {"id": "galopus", "latin": "Mycena galopus", "author": "(Pers.) P. Kumm.", "english": "Milking Bonnet", "section": "Lactipedes", "field_id": "Yes, when fresh", "field_note": "The white milk is the key feature; old or dry specimens may not show it.", "spot": "Snap the stem near the base: a bead of white milk confirms it. Small, grey-brown, in woodland litter.", "traits": {"substrate": ["litter", "grass"], "trees": ["broadleaf", "beech", "oak", "conifer"], "habit": ["group", "single"], "cap": ["small", "medium"], "colour": ["greybrown", "white"], "juice": ["white"], "smell": ["none", "radish"], "stem": ["pale"], "gattach": ["adnexed", "sinuate", "tooth"], "gspace": ["distant"], "gedge": ["paler"]}, "fn": "mycena-galopus", "wfu": "", "src_fn": {"label": "First Nature: Mycena Galopus", "url": "https://www.first-nature.com/fungi/mycena-galopus.php"}, "cap": [{"t": "1 to 2.5 cm, conical then bell-shaped, pale grey-brown with darker radial lines and a darker centre. Var. candida is pure white; var. nigra is blackish.", "s": ["FN", "I"]}], "gills": [{"t": "Fairly distant, white at first, greyish with age.", "s": ["FN"]}], "stem": [{"t": "5 to 10 cm, slender, pale grey above and darker below, base with long white hairs. Releases white milk when broken, especially near the base.", "s": ["I", "FN"]}], "smell": [{"t": "Faint, earthy or slightly of radish.", "s": ["FN", "I"]}], "habitat": [{"t": "Broadleaf and conifer litter; also grassy woodland edges and hedgerows. Singly or in loose groups, often in large numbers.", "s": ["I", "FN", "C"]}], "season": [{"t": "July to late November.", "s": ["FN"]}], "frequency": [{"t": "Very common. 6,342 FRDBI records to 2015 (var. candida 787).", "s": ["C", "I"]}], "lookalikes": [{"t": "M. erubescens: also has white juice, but it tastes bitter; spores and cystidia differ.", "s": ["C"]}, {"t": "Other small grey-brown litter Mycenas: no milk.", "s": ["FN"]}], "micro": [{"t": "Spores cylindrical to ellipsoid, 10 to 13 (16) x 5 to 6 µm, amyloid. Basidia 4-spored, clamps present. Cheilocystidia to 110 µm, smooth, fusiform, some with a nipple; pleurocystidia similar.", "s": ["C", "FN"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": null, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnexed or slightly sinuate, with a short decurrent tooth", "s": ["FN"]}, "spacing": {"t": "Distant", "s": ["FN"]}, "edge": {"t": "Paler than the gill face when mature", "s": ["FN"]}, "colour": {"t": "White, becoming grey-brown", "s": ["FN"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_galopus_1_iNat330779750.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) J Castillo, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/188910961", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_galopus_2_iNat442619581.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) ionafraser, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/247786193", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_galopus_3_iNat584556138.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) ionafraser, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/323077642", "region": "UK", "flag": "Shows var. nigra, the blackish form.", "replace": false, "base": null}]}, {"id": "haematopus", "latin": "Mycena haematopus", "author": "(Pers.) P. Kumm.", "english": "Burgundydrop Bonnet", "section": "Lactipedes", "field_id": "Yes", "field_note": "Dark red juice on wood is diagnostic among common species; M. sanguinolenta is smaller and grows on litter.", "spot": "Tufts of pinkish-brown bells on rotten broadleaf wood; snap a stem and dark red juice appears.", "traits": {"substrate": ["wood"], "trees": ["broadleaf", "oak", "beech"], "habit": ["cluster"], "cap": ["medium", "large"], "colour": ["reddish"], "juice": ["red"], "smell": ["none"], "stem": ["pale"], "gattach": ["adnate", "adnexed"], "gedge": ["darker", "same"]}, "fn": "mycena-haematopus", "wfu": "", "src_fn": {"label": "First Nature: Mycena Haematopus", "url": "https://www.first-nature.com/fungi/mycena-haematopus.php"}, "cap": [{"t": "2 to 4 cm, sturdy for a Mycena; conical then bell-shaped, pinkish to reddish brown, drying paler; striate when moist.", "s": ["FN", "I", "C"]}], "gills": [{"t": "White becoming pale pink; edges often darker.", "s": ["FN"]}], "stem": [{"t": "4 to 7 cm, pinkish brown; dark red-brown juice when broken or cut.", "s": ["FN", "I", "C"]}], "smell": [{"t": "Not distinctive.", "s": ["FN"]}], "habitat": [{"t": "Tufted on stumps, trunks and fallen wood of broadleaf trees, especially oak; occasionally conifer; sometimes on twigs in litter.", "s": ["FN", "I", "C"]}], "season": [{"t": "June to November.", "s": ["FN"]}], "frequency": [{"t": "Fairly common. 2,797 FRDBI records to 2015.", "s": ["C", "FN"]}], "lookalikes": [{"t": "M. sanguinolenta: small, slender, on litter (often conifer); bright red juice and red gill edges.", "s": ["I"]}, {"t": "M. inclinata: no red juice.", "s": ["I"]}], "micro": [{"t": "Spores ellipsoid, 8 to 11 x 5 to 7 µm, amyloid. Cheilocystidia to 90 µm, fusiform with long pointed necks and pinkish contents; pleurocystidia similar.", "s": ["FN", "C"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": {"t": "None", "s": ["FN"]}, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate or adnexed", "s": ["FN"]}, "spacing": {"t": "15 to 26 full-length gills reach the stem (Funga Nordica).", "s": ["FN08"]}, "edge": {"t": "Often darker than the face, but not always; Funga Nordica: usually with some reddish brown colour, at least towards the cap margin, sometimes the gill colour.", "s": ["FN", "FN08"]}, "colour": {"t": "White, becoming pale pink", "s": ["FN"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_haematopus_1_iNat570801418.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Avery Kendra, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/315947103", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_haematopus_2_iNat588072378.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Barry Walter, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/324856393", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_haematopus_3_iNat569211043.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Avery Kendra, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/315110211", "region": "UK", "flag": "", "replace": false, "base": null}]}, {"id": "inclinata", "latin": "Mycena inclinata", "author": "(Fr.) Quél.", "english": "Clustered Bonnet", "section": "Mycena", "field_id": "Usually", "field_note": "Growth on oak, the two-tone stem and the smell together are reliable.", "spot": "Dense clusters on oak stumps; stems white at the top shading to orange-brown at the base; strong rancid-mealy smell when crushed.", "traits": {"substrate": ["wood"], "trees": ["oak", "broadleaf"], "habit": ["cluster"], "cap": ["medium", "large"], "colour": ["greybrown"], "juice": ["none"], "smell": ["rancid"], "stem": ["orangebase"], "gattach": ["adnate"]}, "fn": "mycena-inclinata", "wfu": "", "src_fn": {"label": "First Nature: Mycena Inclinata", "url": "https://www.first-nature.com/fungi/mycena-inclinata.php"}, "cap": [{"t": "2 to 3.5 cm, conical then bell-shaped, grey to grey-brown, darker at the centre; striate almost to the centre; margin scalloped or finely toothed.", "s": ["FN", "I"]}], "gills": [{"t": "White, becoming pinkish grey.", "s": ["FN"]}], "stem": [{"t": "5 to 10 cm, shiny; white or pale grey at the top, grading through dull orange to dark red-brown at the downy base.", "s": ["I", "FN", "C"]}], "smell": [{"t": "Rancid or mealy, strong when a cap is crushed; Cullington also likens it to lupins. Some sources describe it as slight.", "s": ["I", "C", "FN"]}], "habitat": [{"t": "In dense clusters on the sides or tops of stumps and fallen trunks of oak, sometimes other broadleaf trees.", "s": ["I", "C", "FN"]}], "season": [{"t": "June to November.", "s": ["FN"]}], "frequency": [{"t": "3,953 FRDBI records to 2015.", "s": ["C"]}], "lookalikes": [{"t": "M. galericulata: larger, stem grey and polished, no rancid smell.", "s": ["I"]}, {"t": "M. polygramma: grooved silvery stem.", "s": ["FN"]}, {"t": "White-capped forms are known (CBIB note, UD5).", "s": ["CBIB"]}], "micro": [{"t": "Spores fat ellipsoid, 8 to 10 x 5 to 7 µm, amyloid. Cheilocystidia to 35 µm, irregularly club-shaped with long forking outgrowths; pleurocystidia absent.", "s": ["FN", "C"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": {"t": "None", "s": ["FN"]}, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate", "s": ["FN"]}, "spacing": {"t": "(18) 20 to 25 (28) full-length gills reach the stem (Funga Nordica).", "s": ["FN08"]}, "edge": null, "colour": {"t": "White, becoming pinkish grey", "s": ["FN"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_inclinata_1_iNat754991443.jpg", "licence": "CC0", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "no rights reserved", "url": "https://www.inaturalist.org/observations/410502825", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_inclinata_2_iNat445733793.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Tammy, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/249357837", "region": "UK", "flag": "Single fruitbody in hand; does not show the clustered habit. Replace.", "replace": true, "base": null}, {"file": "Mycena_Pilot/images/Mycena_inclinata_3_iNat454407320.jpeg", "licence": "CC0", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "no rights reserved", "url": "https://www.inaturalist.org/observations/253747617", "region": "UK", "flag": "", "replace": false, "base": null}]}, {"id": "rosea", "latin": "Mycena rosea", "author": "Gramberg", "english": "Rosy Bonnet", "section": "Calodontes", "field_id": "Usually", "field_note": "Separate from M. pura by the larger, clear rose-pink cap and later season; spores are larger.", "spot": "A large, fleshy, rose-pink bonnet with a white stem and a strong radish smell, in beech litter late in the year.", "traits": {"substrate": ["litter"], "trees": ["beech", "broadleaf"], "habit": ["group", "single"], "cap": ["medium", "large"], "colour": ["pinklilac"], "juice": ["none"], "smell": ["radish"], "stem": ["pale"], "gattach": ["sinuate"], "gspace": ["crowded"]}, "safety": "Contains muscarine; poisonous.", "safety_src": ["FN"], "fn": "mycena-rosea", "wfu": "", "src_fn": {"label": "First Nature: Mycena Rosea", "url": "https://www.first-nature.com/fungi/mycena-rosea.php"}, "cap": [{"t": "2 to 6 cm, convex to bell-shaped, rose-pink fading to pale pink with age and when dry.", "s": ["FN", "I"]}], "gills": [{"t": "Pale pink, crowded.", "s": ["FN"]}], "stem": [{"t": "6 to 8 cm, white or pale pink, tapering upward from a broader base; base slightly downy.", "s": ["I", "FN"]}], "smell": [{"t": "Strongly of radish when crushed.", "s": ["FN", "I"]}], "habitat": [{"t": "Broadleaf and mixed woodland litter, especially under beech; also verges by beech hedges.", "s": ["FN", "I"]}], "season": [{"t": "August to November, often persisting until the first frosts.", "s": ["FN"]}], "frequency": [{"t": "1,806 FRDBI records to 2015.", "s": ["C"]}], "lookalikes": [{"t": "M. pura: smaller, lilac rather than rose-pink, earlier; smaller spores.", "s": ["FN", "WFU"]}], "micro": [{"t": "Spores ellipsoid, 7 to 9 x 4 to 5.5 µm. Microscopy as M. pura, sometimes with extra rounded elements among the cheilocystidia.", "s": ["FN", "C"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": {"t": "None", "s": ["FN"]}, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Deeply sinuate", "s": ["FN"]}, "spacing": {"t": "Crowded; broad", "s": ["FN"]}, "edge": null, "colour": {"t": "Pale pink", "s": ["FN"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_rosea_1_iNat443645570.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Virn Stothers, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/248308762", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_rosea_2_iNat438609809.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Charlotte Forrest-King, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/245760325", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_rosea_3_iNat434702245.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Margaret Forrest, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/243756132", "region": "UK", "flag": "", "replace": false, "base": null}]}, {"id": "pura", "latin": "Mycena pura", "author": "(Pers.) P. Kumm.", "english": "Lilac Bonnet", "section": "Calodontes", "field_id": "Usually", "field_note": "Colour varies widely; the radish smell is the constant. A white form exists. Yellow forms are now M. luteovariegata (CBIB).", "spot": "A fleshy lilac bonnet in litter that smells strongly of radish when crushed.", "traits": {"substrate": ["litter", "grass"], "trees": ["broadleaf", "beech", "oak", "conifer"], "habit": ["group", "single"], "cap": ["medium", "large"], "colour": ["pinklilac", "white"], "juice": ["none"], "smell": ["radish"], "stem": ["pale"], "gattach": ["adnate", "decurrent"], "gspace": ["crowded", "distant"]}, "safety": "Contains muscarine; poisonous.", "safety_src": ["FN"], "fn": "mycena-pura", "wfu": "lilac-bonnet", "src_fn": {"label": "First Nature: Mycena Pura", "url": "https://www.first-nature.com/fungi/mycena-pura.php"}, "src_wfu": {"label": "Wild Food UK: Lilac Bonnet", "url": "https://www.wildfooduk.com/mushroom-guide/lilac-bonnet/"}, "cap": [{"t": "2 to 5 cm, bell-shaped then flattened with a slight boss; usually lilac to pink-violet with a paler edge, but variable and sometimes cream or white; margin lined when moist.", "s": ["FN", "C", "I"]}], "gills": [{"t": "Pale grey with a lilac tint; adnate or slightly decurrent.", "s": ["FN", "WFU"]}], "stem": [{"t": "4 to 8 cm, similar colour to the cap or greyish, smooth, often twisted.", "s": ["FN", "WFU", "I"]}], "smell": [{"t": "Strongly of radish when crushed.", "s": ["FN", "C", "I"]}], "habitat": [{"t": "Litter in broadleaf and conifer woodland, typically under beech and oak; less often in grassland.", "s": ["C", "I", "FN"]}], "season": [{"t": "June to November.", "s": ["FN", "WFU"]}], "frequency": [{"t": "Common. 6,669 FRDBI records to 2015.", "s": ["C", "I"]}], "lookalik  "field_id": "Yes", "field_note": "No other common British Mycena has orange juice.", "spot": "On beech debris; stems orange-red at the base and bleeding saffron-orange juice; caps often spotted orange.", "traits": {"substrate": ["wood", "buried", "litter"], "trees": ["beech"], "habit": ["group", "single"], "cap": ["small", "medium"], "colour": ["orange", "greybrown", "reddish", "white"], "juice": ["orange"], "smell": ["none", "bleach", "radish"], "stem": ["orangebase"], "gattach": ["adnate", "tooth"]}, "fn": "mycena-crocata", "wfu": "", "src_fn": {"label": "First Nature: Mycena Crocata", "url": "https://www.first-nature.com/fungi/mycena-crocata.php"}, "cap": [{"t": "0.5 to 2.5 cm, conical then bell-shaped; centre reddish or orange-brown, paler toward the margin, often stained with orange spots. Colour ranges from white to almost black.", "s": ["FN", "C"]}], "gills": [{"t": "Whitish, often spotted orange.", "s": ["FN"]}], "stem": [{"t": "5 to 8 cm, yellow to orange, redder toward the base; copious saffron-orange juice when broken, sometimes also from the damaged cap.", "s": ["FN", "C"]}], "smell": [{"t": "Faint, of bleach or radish.", "s": ["FN"]}], "habitat": [{"t": "Fallen wood and woody debris of beech; Cullington records it only on beech.", "s": ["C", "FN"]}], "season": [{"t": "June to November.", "s": ["FN"]}], "frequency": [{"t": "835 FRDBI records to 2015; the fewest of the ten pilot species.", "s": ["C"]}], "lookalikes": [{"t": "None among common species once the orange juice is seen.", "s": ["FN"]}], "micro": [{"t": "Spores ellipsoid, amyloid. Cheilocystidia to 43 µm, irregularly club-shaped with long necks and brush-like outgrowths.", "s": ["C", "FN"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": {"t": "None", "s": ["FN"]}, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate with a decurrent tooth", "s": ["FN"]}, "spacing": {"t": "20 to 25 (29) full-length gills reach the stem (Funga Nordica).", "s": ["F  {"id": "polygramma", "latin": "Mycena polygramma", "author": "(Bull.) Gray", "english": "Grooved Bonnet", "section": "Fragilipedes", "field_id": "Usually", "field_note": "The fine lengthwise grooves on the stem separate it from Common Bonnet and Clustered Bonnet; they can be faint, so look along the stem against the light.", "spot": "Like a slim Common Bonnet on broadleaf stumps, but the long grey stem is finely grooved along its length, often with a silvery sheen.", "traits": {"substrate": ["wood", "buried"], "trees": ["broadleaf", "oak"], "habit": ["single", "group", "cluster"], "cap": ["medium", "large"], "colour": ["greybrown"], "juice": ["none"], "smell": ["none"], "stem": ["grooved", "tough"], "gattach": ["adnate", "adnexed"], "gspace": ["crowded"]}, "fn": "mycena-polygramma", "wfu": "", "src_fn": {"label": "First Nature: Mycena Polygramma", "url": "https://www.first-nature.com/fungi/mycena-polygramma.php"}, "cap": [{"t": "2 to 5 cm; conical, then bell-shaped with an umbo; grey to grey-brown, darker at the centre; striate almost to the centre, the margin sometimes scalloped or toothed; shiny to satiny.", "s": ["FN", "C"]}], "gills": [{"t": "White to pale grey, becoming pinkish grey with age.", "s": ["FN", "FN08"]}], "stem": [{"t": "5 to 15 cm long and 1 to 5 mm thick; grey to grey-brown, often with a silvery blue-grey sheen, white at the top and darker towards the downy, rooting base; finely grooved lengthways, sometimes only faintly; tough.", "s": ["FN", "FN08", "C"]}], "smell": [{"t": "Not distinctive.", "s": ["FN"]}], "habitat": [{"t": "Stumps, fallen trunks and woody debris of broadleaf trees, often oak, sometimes rooting from buried wood; very rarely on conifers. Singly or in small groups.", "s": ["FN", "FN08", "C"]}], "season": [{"t": "June to November; mainly late autumn.", "s": ["FN", "C", "FN08"]}], "frequency": [{"t": "Very common. 3,296 FRDBI records to 2015.", "s": ["C"]}], "lookalikes": [{"t": "Common Bonnet (M. galericulata): smooth, polished stem; gills joined by cross-veins.", "s": ["FN", "I"]}, {"t": "Clustered Bonnet (M. inclinata): dense clusters on oak, stem orange-brown below, rancid smell.", "s": ["I"]}], "micro": [{"t": "Spores broadly ellipsoid, 7.5 to 10 x 5 to 7 µm, amyloid. Cheilocystidia irregularly fusiform with one or more long fingers; pleurocystidia absent; clamps abundant.", "s": ["FN", "FN08", "C"]}], "conflicts": [], "spore": {"t": "White", "s": ["FN"]}, "ring": {"t": "None", "s": ["FN"]}, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate (First Nature); narrowly adnate or adnexed (Funga Nordica)", "s": ["FN", "FN08"]}, "spacing": {"t": "23 to 35 full-length gills reach the stem (Funga Nordica)", "s": ["FN08"]}, "edge": null, "colour": {"t": "White to pale grey, then pinkish grey", "s": ["FN", "FN08"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_polygramma_1_iNat442592490.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Virn Stothers, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/247771505", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_polygramma_2_iNat5736577.jpg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Paul Cook, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/4738578", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_polygramma_3_iNat761967161.jpg", "licence": "CC0", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "no rights reserved", "url": "https://www.inaturalist.org/observations/413954336", "region": "UK", "flag": "", "replace": false, "base": null}]}, {"id": "filopes", "latin": "Mycena filopes", "author": "(Bull.) P. Kumm.", "english": "Iodine Bonnet" rowths; pleurocystidia absent or rare.", "s": ["FN08", "C"]}], "conflicts": [], "spore": null, "ring": null, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate with a decurrent tooth", "s": ["FN08"]}, "spacing": null, "edge": {"t": "Smooth", "s": ["C"]}, "colour": {"t": "White, often pink-tinged", "s": ["FN08"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_filopes_1_iNat458719834.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) J Castillo, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/255918171", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_filopes_2_iNat333836946.jpeg", "licence": "CC-BY", "status": "Green", "status_note": "Open licence: may be reused with credit", "attribution": "(c) Susan Marley, some rights reserved (CC BY)", "url": "https://www.inaturalist.org/observations/190436937", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_filopes_3_iNat734352952.jpg", "licence": "CC-BY-NC", "status": "Amber", "status_note": "Non-commercial licence: personal or non-commercial use only", "attribution": "(c) Kyle Power, some rights reserved (CC BY-NC)", "url": "https://www.inaturalist.org/observations/400203456", "region": "UK", "flag": "", "replace": false, "base": null}]}, {"id": "speirea", "latin": "Phloeomana speirea", "author": "(Fr.) Redhead", "english": "Bark Bonnet", "section": "Hiemales", "field_id": "With caution", "field_note": "Several tiny pale bonnets with running gills grow on wood; the dark central dot and few, distant, decurrent gills help, but confirmation needs microscopy (Cullington).", "spot": "Tiny pale grey-brown caps with a dark central dot and a few widely spaced gills running down the stem, on fallen twigs and bark.", "traits": {"substrate": ["wood", "buried"], "trees": [ ith a dark red-brown edge along the whole gill.", "s": ["FN08", "C"]}], "stem": [{"t": "2 to 10 cm long and 0.5 to 1.5 mm thick; fawn, clay pink to dark red-brown, sometimes dotted red at the top; usually yields a little brownish red or pink watery fluid when broken.", "s": ["FN08", "C"]}], "smell": [], "habitat": [{"t": "Litter, needles, twigs and buried wood in conifer woods, commonly with spruce, often in deep moss; also with birch, beech and oak on poor soils.", "s": ["C", "FN08"]}], "season": [{"t": "Early summer to late autumn (Funga Nordica, a Nordic treatment).", "s": ["FN08"]}], "frequency": [{"t": "Very common. 2,618 FRDBI records to 2015.", "s": ["C"]}], "lookalikes": [{"t": "Burgundydrop Bonnet (M. haematopus): larger, in tufts on rotten broadleaf wood, darker red juice.", "s": ["I", "C"]}, {"t": "M. capillaripes: similar, with spruce, but no red juice.", "s": ["C"]}], "micro": [{"t": "Spores 7 to 10 x 4.5 to 6 µm, teardrop-shaped, amyloid. Cheilocystidia to 65 µm, fusiform with long sharp tips and red-brown contents; a few pleurocystidia.", "s": ["FN08", "C"]}], "conflicts": [], "spore": null, "ring": null, "volva": null, "flesh": null, "chem": null, "gillspec": {"attachment": {"t": "Adnate to subdecurrent", "s": ["FN08"]}, "spacing": {"t": "13 to 21 reach the stem", "s": ["FN08"]}, "edge": {"t": "Dark red-brown", "s": ["FN08", "C"]}, "colour": {"t": "White", "s": ["FN08"]}, "other": null}, "genus": {}, "photos": [{"file": "Mycena_Pilot/images/Mycena_sanguinolenta_1_iNat151765634.jpeg", "licence": "CC-BY-NC", "status": "Amber", "status_note": "Non-commercial licence: personal or non-commercial use only", "attribution": "(c) bobsyouruncle, some rights reserved (CC BY-NC)", "url": "https://www.inaturalist.org/observations/91721959", "region": "UK", "flag": "", "replace": false, "base": null}, {"file": "Mycena_Pilot/images/Mycena_sanguinolenta_2_iNat210603343.jpeg", "licence": "CC-BY-NC", "status": "Amber", "status_note": "Non-commercial licence: personal     const lat=typeof meta.latitude==='number'&&isFinite(meta.latitude)?meta.latitude:null, lon=typeof meta.longitude==='number'&&isFinite(meta.longitude)?meta.longitude:null;

async function saveForay(){ const d=FX.ydraft; if(!d.name.trim()){ FX.msg='Give the foray a name.'; return render(); }
  const now=new Date().toISOString(), body=Object.assign({},d); delete body.id; delete body.participants; body.kind='foray'; body.updated=now; if(!body.created) body.created=now;
  if(d.group) LS.set('fxgroup', d.group);
  const ref=d.id?FX.col.doc(d.id):FX.col.doc(); d.id=ref.id; FX.activeForay=ref.id; LS.set('activeForay',ref.id);
  ref.set(body).catch(()=>{ FX.msg='The foray is not yet sent; it will be saved when you have signal.'; render(); });
  FX.ydraft=null; LS.set('fxydraft',null); FX.msg=''; go('foray-'+ref.id); }

function speciesList(fs){ const m=new Map(); const rank={certain:0,probable:1,possible:2,unknown:3};
  fs.forEach(f=>{ const k=taxonKey(f); const e=m.get(k)||{k, name:taxonName(f), latin:taxonLatin(f), n:0, best:'unknown', first:f.id, taxon:f.taxon}; e.n++; if((rank[f.confidence]??3)<(rank[e.best]??3)) e.best=f.confidence; m.set(k,e); });
  return [...m.values()].sort((a,b)=>(a.latin||a.name).localeCompare(b.latin||b.name)); }
function mapSVG(fs){
  const pts=fs.map((f,i)=>({f,i,p:fxPos(f)})).filter(x=>x.p); if(!pts.length) return '<p class="nr" style="margin:0">No positions recorded for these finds.</p>';
  let x0=Math.min(...pts.map(q=>q.p.E)), x1=Math.max(...pts.map(q=>q.p.E)), y0=Math.min(...pts.map(q=>q.p.N)), y1=Math.max(...pts.map(q=>q.p.N));
  const span=Math.max(x1-x0,y1-y0,200)*1.35, cx=(x0+x1)/2, cy=(y0+y1)/2; x0=cx-span/2; x1=cx+span/2; y0=cy-span/2; y1=cy+span/2;
  const W=600, H=600, sx=e=>(e-x0)/span*W, sy=n=>H-(n-y0)/span*H;
  const step=[100,200,500,1000,2000,5000,10000].find(s=>span/s<=8)||10000;
  let g=''; for(let e=Math.ceil(x0/step)*step; e<=x1; e+=step){ const km=e%1000===0; g+=`<line class="${km?'g2':'g1'}" x1="${sx(e)}" y1="0" x2="${sx(e)}" y2="${H}"/>`; if(km) g+=`<text class="gl" x="${sx(e)+4}" y="20">${String(Math.floor(e/1000)%100).padStart(2,'0')}</text>`; }
  for(let n=Math.ceil(y0/step)*step; n<=y1; n+=step){ const km=n%1000===0; g+=`<line class="${km?'g2':'g1'}" x1="0" y1="${sy(n)}" x2="${W}" y2="${sy(n)}"/>`; if(km) g+=`<text class="gl" x="4" y="${sy(n)-4}">${String(Math.floor(n/1000)%100).padStart(2,'0')}</text>`; }
  const sbm=[50,100,200,500,1000,2000].find(s=>s/span*W>=110)||2000, sbw=sbm/span*W;
  const sq=GEO.gridRef(cx,cy,2).slice(0,2);
  return `<svg class="fx-map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plot of find positions on the OS National Grid">${g}
   ${pts.map(q=>`<g data-go="find-${q.f.id}"><circle class="pt" cx="${sx(q.p.E).toFixed(1)}" cy="${sy(q.p.N).toFixed(1)}" r="16"/><text class="pn" text-anchor="middle" x="${sx(q.p.E).toFixed(1)}" y="${(sy(q.p.N)+6).toFixed(1)}">${q.i+1}</text></g>`).join('')}
   <line class="sb" x1="${W-16-sbw}" y1="${H-16}" x2="${W-16}" y2="${H-16}"/><text class="sbt" text-anchor="end" x="${W-16}" y="${H-26}">${sbm>=1000?sbm/1000+' km':sbm+' m'}</text></svg>
   <p class="fx-status" style="margin:4px 0 0">OS grid square ${esc(sq)}; lines every ${step>=1000?step/1000+' km':step+' m'}, labelled in kilometres. Numbers match the finds list. <a href="${osmLink(GEO.toLL(cx,cy).lat,GEO.toLL(cx,cy).lon,15)}" target="_blank" rel="noopener">Open the area in OpenStreetMap</a>.</p>`;
}

function fxMailto(y,fs,spp){ const lines=[`${y.name}, ${ukDate(y.date)}${y.site?', '+y.site:''}`, '', `${fs.length} finds, ${spp.length} taxa`, ''].concat(spp.map(s=>`${s.latin||s.name}${s.latin?' ('+s.name+')':''}: ${s.n} (${s.best})`));

/* ---------- export: spreadsheet aligned to iRecord and FRDBI fields, photographs with sidecar data ---------- */

/* ---------- export v2: iRecord column names first, then FRDBI and county fields, then the app's own ---------- */
const CERT = {certain:'Certain', probable:'Likely', possible:'Uncertain', unknown:''};
const ukd = s => s ? s.split('-').reverse().join('/') : '';
const surnameFirst = n => { n=String(n||'').trim(); const p=n.split(/\s+/); return p.length>1 && !n.includes(',') ? `${p[p.length-1]}, ${p.slice(0,-1).join(' ')}` : n; };
function refDigits(f){ const a=f.acc||0; return a && a<=10 ? 8 : a && a<=100 ? 6 : a ? 4 : 8; }
function exportRef(f){ if(f.lat==null) return (f.gridref||'').replace(/\s+/g,''); const p=fxPos(f); return GEO.gridRef(p.E,p.N,refDigits(f)).replace(/\s+/g,''); }
const EXCOLS=['Species','Common name','Date','Grid ref','Location name','Vice County (supplied)','Recorder Name','Identified By','Stage','Certainty','Quantity','Habitat','Comment','Sample comment','Sample method','External key',
  'Substrate','Associated organism','Finder','Specimen kept','Altitude (m)','Record no','Time','Precision (m)','Easting','Northing','Latitude','Longitude','Rank','App confidence','Spore print','Characters observed','Foray','Photo files'];
function exportRows(fs){ return fs.map((f,i)=>{ const p=fxPos(f), y=f.foray&&fxForay(f.foray), no=i+1;
  const chars=Object.entries(f.chars||{}).map(([k,v])=>`${k}=${v}`).join('; '); const name=taxonLatin(f)||f.taxonText||'';
  const alt=(f.photos||[]).map(x=>x.alt).find(x=>x!=null);
  return [(f.confidence==='possible'&&name?'cf. ':'')+name, f.taxon?f.taxon.english:'', ukd(f.date), exportRef(f), f.site||(y&&(y.site||y.name))||'', (y&&y.vc)||'',
    surnameFirst(f.recorder||FX.me||''), surnameFirst(f.identifier||f.determiner||''), 'Not recorded', CERT[f.confidence]||'', f.abundance||'', f.habitat||'', f.notes||'', y?(y.notes||''):'', y?'Fungus foray':'', f.id,
    f.substrate||'', f.host||'', surnameFirst(f.finder||''), f.specimen?'Yes':'No', alt!=null?alt:'', no, f.time||'', f.acc?Math.round(f.acc):'', p?Math.round(p.E):'', p?Math.round(p.N):'',
    f.lat!=null?+f.lat.toFixed(6):'', f.lon!=null?+f.lon.toFixed(6):'', f.taxon?f.taxon.rank:(name?'free text':''), f.confidence||'', f.sporeprint||'', chars, y?y.name:'',
    (f.photos||[]).map((ph,j)=>`photos/${String(no).padStart(3,'0')}_${j+1}.jpg`).join('; ')]; }); }
const named = f => !!(taxonLatin(f)||f.taxonText) && f.confidence!=='unknown';

      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Taxon (Latin)','English name','Finds','Best confidence']].concat(speciesList(fs).map(s=>[s.latin||s.name,s.latin?s.name:'',s.n,s.best]))),'Species list'); }
    sheet=new Blob([X.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
  catch(e){ ext='csv'; const q=v=>{ let s=String(v); if(/^[=+\-@]/.test(s)) s="'"+s; return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    sheet=new Blob([[EXCOLS].concat(rows,todoRows).map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}); }

  if(nphotos){ try{ const Z=await lib('zip'); const z=new Z(); z.file(`${base}.${ext}`, sheet); const side=[];
      for(let i=0;i<fs.length;i++){ const f=fs[i]; for(let j=0;j<(f.photos||[]).length;j++){ const ph=f.photos[j], fn=`photos/${String(i+1).padStart(3,'0')}_${j+1}.jpg`;
        FX.msg=`Adding photos to the export (${side.length+1} of ${nphotos})…`; render();
        try{ const r=await fetch(blobUrl(ph.asset)); if(r.ok){ z.file(fn, await r.blob()); } }catch(e){}
        const meta={record:i+1, file:fn, taxon:taxonLatin(f)||f.taxonText||'', english:f.taxon?f.taxon.english:'', taken:ph.taken||'', latitude:ph.lat, longitude:ph.lon, gridref:fxGridRef(f), original_name:ph.name||'', find_id:f.id};
        z.file(fn.replace(/\.jpg$/,'.json'), JSON.stringify(meta,null,1)); side.push(meta); } }
      z.file('records.json', JSON.stringify({exported:new Date().toISOString(), foray:y||null, finds:fs},null,1));
      out=await z.generateAsync({type:'blob'}); name=`${base}.zip`; }catch(e){ out=sheet; name=`${base}.${ext}`; } }
  try{ await FX.dl.save({filename:name, data:out}); LOCAL.markExported(fs); FX.msg=`Saved ${name} to Downloads.`; }
  catch(e){ FX.msg = e&&e.code==='declined' ? 'Export cancelled.' : 'The file could not be saved.'; }

}
